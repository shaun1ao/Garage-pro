<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your car's service history · Garage Pro</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0e14;--bg2:#121722;--surf:#0e1420;--border:#26303f;--text:#e7ecf3;--dim:#9fb0c6;--faint:#69788f;--acc:#ff7a18;--acc2:#ffb347;--teal:#20e3b2;--red:#ff6b6b;--fd:'Sora',sans-serif;--fb:'Inter',sans-serif}
  @media (prefers-color-scheme: light){:root{--bg:#f6f4ef;--bg2:#efece4;--surf:#fff;--border:#e2ddd2;--text:#16130e;--dim:#5b564b;--faint:#8b8576;--teal:#0c8f6c;--red:#d63b3b}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);-webkit-font-smoothing:antialiased}
  a{color:var(--acc2)}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font:700 15px var(--fd)}
  .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center}
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 70px}
  h1{font:800 clamp(24px,5vw,30px)/1.15 var(--fd);margin:0 0 4px}
  .sub{color:var(--dim);font-size:14.5px;line-height:1.6;margin:0 0 4px}
  .plate{display:inline-block;background:#f6c332;color:#16130e;font:800 15px 'Courier New',monospace;padding:3px 11px;border-radius:5px;letter-spacing:1px}
  .card{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
  .muted{color:var(--faint);font-size:13.5px}
  .pill{display:inline-block;padding:5px 12px;border-radius:100px;background:var(--bg2);border:1px solid var(--border);color:var(--dim);font-size:12.5px;text-decoration:none}
  .cta{display:block;text-align:center;padding:13px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc,#170f05);font:800 15px var(--fd);text-decoration:none;border:0;width:100%;cursor:pointer}
  h2{font:700 15px var(--fd);margin:0 0 12px}
  .ev{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)} .ev:last-child{border-bottom:0}
  .ev .d{min-width:88px;color:var(--faint);font-size:13px}
  .ev b{font-size:14.5px} .ev .w{color:var(--dim);font-size:13px;margin-top:2px;line-height:1.5}
  label{display:block;font:600 12.5px var(--fb);color:var(--dim);margin:12px 0 5px}
  input,select{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font:500 15px var(--fb)}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ok{padding:14px;border-radius:12px;background:rgba(32,227,178,.12);color:var(--teal);font-weight:600;line-height:1.55}
  .err{color:var(--red);font-size:13px;margin-top:8px;min-height:16px}
  footer{padding:22px;text-align:center;color:var(--faint);font-size:12.5px}
  .skeleton{height:120px;border-radius:14px;background:linear-gradient(90deg,var(--bg2),var(--surf),var(--bg2));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="top"><a class="brand" href="/"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#170f05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.4 2.4-2.1-.6-.6-2.1z"/></svg></span><span class="bname">Garage Pro</span></a></div>
<div class="wrap" id="app"><div class="skeleton"></div></div>
<footer id="poweredby">Powered by <a href="/">Garage Pro</a></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({ apiKey: "AIzaSyA1PzbhboU9Qdlpqs5cbLR3hsvFpWXCI54", authDomain: "garagepro26.firebaseapp.com", projectId: "garagepro26",
  storageBucket: "garagepro26.firebasestorage.app", messagingSenderId: "605094681607", appId: "1:605094681607:web:095fbfb8ff0446faaedea2" });
const db = firebase.firestore();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https:\/\//.test(u || '') ? u : '';
const parts = location.pathname.split('/').filter(Boolean);
const TOKEN = new URLSearchParams(location.search).get('t') || (parts[0] === 'v' ? parts[1] : '');
let V = null;

function applyBrand(b, name) {
  b = b || {};
  const root = document.documentElement.style;
  if (/^#[0-9a-fA-F]{6}$/.test(b.color || '')) {
    const n = parseInt(b.color.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, bl = n & 255, mix = x => Math.round(x + (255 - x) * 0.28);
    root.setProperty('--acc', b.color); root.setProperty('--acc2', `rgb(${mix(r)},${mix(g)},${mix(bl)})`);
    root.setProperty('--onacc', (0.299 * r + 0.587 * g + 0.114 * bl) / 255 > 0.62 ? '#16130e' : '#ffffff');
  }
  const brand = document.querySelector('.brand'); if (!brand) return;
  const logoEl = brand.querySelector('.logo'), nm = brand.querySelector('.bname');
  if (name && nm) nm.textContent = name;
  if (logoEl) {
    if (/^(data:image\/(png|jpeg|webp);base64,|https:\/\/)/.test(b.logo || '')) {
      logoEl.style.cssText = 'background:#fff;padding:3px 6px;width:auto;min-width:32px;height:34px';
      logoEl.innerHTML = '<img alt="" style="height:26px;max-width:120px;object-fit:contain;display:block">'; logoEl.firstChild.src = b.logo;
    } else if (name) {
      logoEl.innerHTML = '<span style="font:800 16px var(--fd);color:var(--onacc,#170f05)"></span>'; logoEl.firstChild.textContent = name.trim().charAt(0).toUpperCase();
    }
  }
  $('poweredby').innerHTML = 'Powered by <a href="/" style="color:inherit;font-weight:700;text-decoration:none">Garage Pro</a>';
}
const iso = d => d.toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; };
const fmtDate = s => { const d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };

async function load() {
  if (!/^[A-Za-z0-9]{12,40}$/.test(TOKEN || '')) return location.replace('/403.html?why=link');
  try {
    const snap = await db.collection('vehicle_pages').doc(TOKEN).get();
    if (!snap.exists) return location.replace('/403.html?why=link');
    V = snap.data(); render();
  } catch (e) {
    if (e && e.code === 'permission-denied') return location.replace('/403.html?why=link');
    $('app').innerHTML = `<div class="card">Couldn't load this page. ${esc(e.message || e)}</div>`;
  }
}
function render() {
  const w = V.workshop || {}, car = V.vehicle || {}, h = V.history || [];
  applyBrand({ color: w.color, logo: w.logo }, w.name);
  document.title = `${V.plate} · service history · ${w.name || 'Garage Pro'}`;
  const book = safeUrl(w.book_url);
  const last = h[0];
  $('app').innerHTML = `
    <span class="plate">${esc(V.plate)}</span>
    <h1 style="margin-top:10px">${esc([car.make, car.model, car.year].filter(Boolean).join(' ') || 'Your vehicle')}</h1>
    <p class="sub">${car.colour ? esc(car.colour) + ' · ' : ''}Service history kept by <b style="color:var(--text)">${esc(w.name || 'your workshop')}</b>${w.city ? ' · ' + esc(w.city) : ''}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px">${w.phone ? `<a class="pill" href="tel:${esc(w.phone)}">📞 Call</a>` : ''}</div>
    ${book ? `<a class="cta" href="${esc(book)}" style="margin-bottom:16px">Book a service →</a>` : (w.phone ? `<a class="cta" href="tel:${esc(w.phone)}" style="margin-bottom:16px">Call to book a service →</a>` : '')}
    <div class="card"><h2>Service history</h2>${h.length ? h.map(x => `<div class="ev"><div class="d">${fmtDate(x.date)}${x.km ? `<div class="muted" style="font-size:12px">${Number(x.km).toLocaleString('en-IN')} km</div>` : ''}</div><div><b>${esc(x.service || 'Service')}</b>${x.work ? `<div class="w">${esc(x.work)}</div>` : ''}</div></div>`).join('') : `<div class="muted" style="padding:6px 0">No completed services recorded yet. They will appear here after your car's first visit.</div>`}</div>
    <div class="card" id="rem"><h2>⏰ Remind me when my next service is due</h2>
      <p class="muted" style="margin:0 0 4px">Tell us your car's current mileage and we'll email you a reminder before it's due — with a link to book. One email, no spam.</p>
      <label>Email</label><input id="rEmail" type="email" autocomplete="email" placeholder="you@example.com">
      <div class="g2"><div><label>Current mileage (km)</label><input id="rKm" type="number" inputmode="numeric" min="0" placeholder="${esc(V.last_km || '')}" value="${esc(V.last_km || '')}"></div>
        <div><label>Service every</label><select id="rInt">${[5000, 7500, 10000, 12000, 15000].map(k => `<option value="${k}" ${k === Number(V.interval_km || 10000) ? 'selected' : ''}>${k.toLocaleString('en-IN')} km</option>`).join('')}</select></div></div>
      <div class="err" id="rErr"></div>
      <button class="cta" id="rBtn" onclick="remind()" style="margin-top:6px">Remind me</button></div>`;
}
async function remind() {
  const err = $('rErr'); err.textContent = '';
  const email = $('rEmail').value.trim(), km = Number($('rKm').value), interval = Number($('rInt').value);
  if (!/^[^@\s]{1,64}@[^@\s]{1,190}\.[^@\s]{2,}$/.test(email)) return err.textContent = 'Please enter a valid email address.';
  if (!(km > 0)) return err.textContent = 'Enter the car\'s current mileage in km.';
  const lastKm = Number(V.last_service_km || 0);
  if (lastKm && km < lastKm - 50) return err.textContent = `That's lower than the ${lastKm.toLocaleString('en-IN')} km recorded at the last service — please check it.`;
  // when is the next service due? whichever comes first: the km interval at the car's usual daily distance, or the time interval
  const avg = Math.max(5, Number(V.avg_km_day) || 30), base = lastKm && km >= lastKm ? lastKm : km;
  const kmLeft = Math.max(0, interval - (km - base));
  let due = addDays(new Date(), Math.ceil(kmLeft / avg));
  const months = Number(V.interval_months) || 6;
  if (V.last_service_date) { const t = new Date(V.last_service_date); t.setMonth(t.getMonth() + months); if (!isNaN(t) && t < due) due = t; }
  if (due < addDays(new Date(), 3)) due = addDays(new Date(), 3);
  const remindAt = addDays(due, -7) > addDays(new Date(), 1) ? addDays(due, -7) : addDays(new Date(), 1);
  const btn = $('rBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const w = V.workshop || {};
    await db.collection('service_reminders').add({
      token: TOKEN, uid: String(V.uid || ''), plate: String(V.plate || '').slice(0, 20), email: email.slice(0, 254), km_now: Math.round(km), interval_km: interval, avg_km_day: Math.round(avg),
      due_on: iso(due), remind_at: iso(remindAt), workshop_name: String(w.name || '').slice(0, 80), vehicle: [V.vehicle && V.vehicle.make, V.vehicle && V.vehicle.model].filter(Boolean).join(' ').slice(0, 80),
      book_url: safeUrl(w.book_url).slice(0, 200), created_at: new Date().toISOString(), sent: false
    });
    $('rem').innerHTML = `<div class="ok">✓ Done! We'll email <b>${esc(email)}</b> around <b>${fmtDate(iso(remindAt))}</b> — your next service is due about <b>${fmtDate(iso(due))}</b>.</div>`;
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Remind me';
    err.textContent = 'Could not save the reminder — please try again in a moment.';
  }
}
load();
</script>
<script src="i18n/gp-lang.js"></script>
</body>
</html>
