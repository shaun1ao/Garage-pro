<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Breakdown help · Garage Pro</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0e14;--bg2:#121722;--surf:#0e1420;--border:#26303f;--text:#e7ecf3;--dim:#9fb0c6;--faint:#69788f;--acc:#ff7a18;--acc2:#ffb347;--teal:#20e3b2;--red:#ff6b6b;--fd:'Sora',sans-serif;--fb:'Inter',sans-serif}
  @media (prefers-color-scheme: light){:root{--bg:#f6f4ef;--bg2:#efece4;--surf:#fff;--border:#e2ddd2;--text:#16130e;--dim:#5b564b;--faint:#8b8576;--teal:#0c8f6c;--red:#d63b3b}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);-webkit-font-smoothing:antialiased}
  a{color:var(--acc2)}
  .top{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font:700 15px var(--fd)}
  .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center}
  .wrap{max-width:520px;margin:0 auto;padding:24px 16px 70px}
  h1{font:800 clamp(24px,6vw,30px)/1.15 var(--fd);margin:0 0 6px}
  .sub{color:var(--dim);font-size:14.5px;line-height:1.6;margin:0 0 14px}
  .card{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
  label{display:block;font:600 12.5px var(--fb);color:var(--dim);margin:12px 0 5px}
  input,select,textarea{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font:500 15px var(--fb)}
  textarea{resize:vertical}
  .btn{display:block;width:100%;margin-top:14px;padding:14px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc,#170f05);font:800 16px var(--fd);cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:700}
  .btn:disabled{opacity:.6}
  .err{color:var(--red);font-size:13px;margin-top:8px;min-height:16px}
  .loc{display:flex;gap:10px;align-items:center;padding:12px;border:1px dashed var(--border);border-radius:12px;font-size:13.5px;color:var(--dim)}
  .loc.ok{border-style:solid;border-color:var(--teal);color:var(--teal);background:rgba(32,227,178,.08)}
  .hp{position:absolute;left:-9999px;opacity:0}
  .stat{display:inline-block;padding:5px 13px;border-radius:100px;font:700 13px var(--fb);background:rgba(255,122,24,.14);color:var(--acc2)}
  .stat.go{background:rgba(32,227,178,.14);color:var(--teal)} .stat.bad{background:rgba(255,107,107,.14);color:var(--red)}
  .big{font:800 22px var(--fd);margin:10px 0 6px}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pill{display:inline-block;padding:8px 14px;border-radius:100px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:13.5px;text-decoration:none}
  footer{padding:22px;text-align:center;color:var(--faint);font-size:12.5px}
  .skeleton{height:120px;border-radius:14px;background:linear-gradient(90deg,var(--bg2),var(--surf),var(--bg2));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="top"><a class="brand" href="/"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#170f05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.4 2.4-2.1-.6-.6-2.1z"/></svg></span><span class="bname">Garage Pro</span></a></div>
<div class="wrap" id="app"><div class="skeleton"></div></div>
<footer id="poweredby">Powered by <a href="/">Garage Pro</a></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({ apiKey: "AIzaSyA1PzbhboU9Qdlpqs5cbLR3hsvFpWXCI54", authDomain: "garagepro26.firebaseapp.com", projectId: "garagepro26",
  storageBucket: "garagepro26.firebasestorage.app", messagingSenderId: "605094681607", appId: "1:605094681607:web:095fbfb8ff0446faaedea2" });
const db = firebase.firestore();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const QS = new URLSearchParams(location.search), parts = location.pathname.split('/').filter(Boolean);
const SLUG = (QS.get('w') || (parts[0] === 'help' ? parts[1] : '') || '').toLowerCase();
let H = null, loc = null, loadedAt = Date.now(), poll = null;
const KEEP = 'gp_help_' + SLUG;

function applyBrand(b, name) {
  b = b || {}; const root = document.documentElement.style;
  if (/^#[0-9a-fA-F]{6}$/.test(b.color || '')) {
    const n = parseInt(b.color.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, bl = n & 255, mix = x => Math.round(x + (255 - x) * 0.28);
    root.setProperty('--acc', b.color); root.setProperty('--acc2', `rgb(${mix(r)},${mix(g)},${mix(bl)})`);
    root.setProperty('--onacc', (0.299 * r + 0.587 * g + 0.114 * bl) / 255 > 0.62 ? '#16130e' : '#ffffff');
  }
  const brand = document.querySelector('.brand'), logoEl = brand.querySelector('.logo'), nm = brand.querySelector('.bname');
  if (name && nm) nm.textContent = name;
  if (/^(data:image\/(png|jpeg|webp);base64,|https:\/\/)/.test(b.logo || '')) { logoEl.style.cssText = 'background:#fff;padding:3px 6px;width:auto;min-width:32px;height:34px'; logoEl.innerHTML = '<img alt="" style="height:26px;max-width:120px;object-fit:contain;display:block">'; logoEl.firstChild.src = b.logo; }
  else if (name) { logoEl.innerHTML = '<span style="font:800 16px var(--fd);color:var(--onacc,#170f05)"></span>'; logoEl.firstChild.textContent = name.trim().charAt(0).toUpperCase(); }
}
async function load() {
  if (!/^[a-z0-9-]{3,48}$/.test(SLUG)) return location.replace('/403.html?why=link');
  try {
    const snap = await db.collection('public_help').doc(SLUG).get();
    if (!snap.exists) return location.replace('/403.html?why=link');
    H = snap.data(); applyBrand(H.brand, H.name); document.title = 'Breakdown help · ' + (H.name || 'Garage Pro');
    let mine = null; try { mine = JSON.parse(localStorage.getItem(KEEP) || 'null'); } catch (_) {}
    if (H.enabled && mine && mine.id && Date.now() - mine.at < 12 * 3600e3) return track(mine.id);
    form();
  } catch (e) { $('app').innerHTML = `<div class="card">Couldn't load this page. ${esc(e.message || e)}</div>`; }
}
function off() { $('app').innerHTML = `<h1>${esc(H.name || 'Breakdown help')}</h1><div class="card"><p class="sub" style="margin:0">This workshop isn't taking online breakdown requests right now.${H.phone ? ' Please call them:' : ''}</p>${H.phone ? `<div class="pills"><a class="pill" href="tel:${esc(H.phone)}">📞 ${esc(H.phone)}</a></div>` : ''}</div>`; }
function form() {
  if (!H.enabled) return off();
  const mins = Number(H.callback_mins) || 15;
  $('app').innerHTML = `
    <h1>My car has broken down</h1>
    <p class="sub"><b>${esc(H.name || 'The workshop')}</b> will call you back within <b>${mins} minutes</b> to arrange help${H.area ? '. ' + esc(H.area) : ''}. If anyone is hurt or you're in danger, call the emergency services first.</p>
    <div class="card">
      <label>What's happened? *</label>
      <select id="fIssue"><option value="">Choose…</option>${['Won’t start', 'Flat tyre / puncture', 'Battery / electrical', 'Overheating', 'Accident / collision', 'Out of fuel', 'Warning light / strange noise', 'Stuck / need recovery', 'Something else'].map(x => `<option>${x}</option>`).join('')}</select>
      <label>Your name *</label><input id="fName" autocomplete="name">
      <label>Mobile number we can call *</label><input id="fPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="${H.country === 'AE' ? '50 123 4567' : '98765 43210'}">
      <label>Vehicle number</label><input id="fPlate" style="text-transform:uppercase" autocomplete="off">
      <label>Car (make &amp; model)</label><input id="fCar" placeholder="e.g. Toyota Camry" autocomplete="off">
      <label>Where are you? *</label>
      <div class="loc" id="locBox"><span>📍</span><span id="locTxt">We need your location so the driver can find you.</span></div>
      <button class="btn ghost" id="locBtn" type="button" style="margin-top:8px">Share my location</button>
      <input id="fPlace" placeholder="Landmark or address (helps if the GPS is off)" style="margin-top:8px" autocomplete="off">
      <label>Anything else? <span style="font-weight:400;color:var(--faint)">(optional)</span></label><textarea id="fNotes" rows="2" maxlength="500" placeholder="Hazard lights on, on the hard shoulder…"></textarea>
      <input class="hp" id="fHp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="err" id="err"></div>
      <button class="btn" id="go" type="button">Request help</button>
    </div>`;
  $('locBtn').onclick = getLoc; $('go').onclick = send; getLoc(true);
}
function getLoc(quiet) {
  if (!navigator.geolocation) { if (!quiet) $('locTxt').textContent = 'This phone can\'t share its location — please type where you are below.'; return; }
  $('locTxt').textContent = 'Finding you…';
  navigator.geolocation.getCurrentPosition(p => {
    loc = { lat: +p.coords.latitude.toFixed(6), lon: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy || 0) };
    $('locBox').className = 'loc ok'; $('locTxt').textContent = `Location found (accurate to about ${loc.acc} m)`; $('locBtn').textContent = 'Update my location';
  }, e => { loc = null; $('locBox').className = 'loc'; $('locTxt').textContent = e && e.code === 1 ? 'Location is blocked in your browser — allow it, or type where you are below.' : 'Couldn\'t get your location — type where you are below.'; }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 20000 });
}
async function send() {
  const err = $('err'); err.textContent = '';
  if ($('fHp').value) return;
  const issue = $('fIssue').value, name = $('fName').value.trim(), phone = $('fPhone').value.replace(/[^\d+]/g, ''), place = $('fPlace').value.trim();
  if (!issue) return err.textContent = 'Please tell us what has happened.';
  if (name.length < 2) return err.textContent = 'Please enter your name.';
  if (phone.replace(/\D/g, '').length < (H.country === 'AE' ? 9 : 10)) return err.textContent = 'Please enter a mobile number we can call.';
  if (!loc && place.length < 4) return err.textContent = 'Please share your location or type where you are.';
  if (Date.now() - loadedAt < 2000) return err.textContent = 'One moment…';
  try { const last = Number(localStorage.getItem(KEEP + '_t') || 0); if (Date.now() - last < 60000) return err.textContent = 'You just sent a request — please wait a minute.'; } catch (_) {}
  const b = $('go'); b.disabled = true; b.textContent = 'Sending…';
  try {
    const ref = db.collection('users').doc(H.uid).collection('breakdown_requests').doc();
    const d = { slug: SLUG, name: name.slice(0, 80), phone: phone.slice(0, 20), issue: issue.slice(0, 100), status: 'new', created_at: new Date().toISOString() };
    const plate = $('fPlate').value.toUpperCase().trim(), car = $('fCar').value.trim(), notes = $('fNotes').value.trim();
    if (plate) d.plate = plate.slice(0, 20); if (car) d.vehicle = car.slice(0, 100); if (notes) d.notes = notes.slice(0, 500); if (place) d.place = place.slice(0, 200);
    if (loc) { d.lat = loc.lat; d.lon = loc.lon; d.acc = loc.acc; }
    await ref.set(d);
    try { localStorage.setItem(KEEP, JSON.stringify({ id: ref.id, at: Date.now() })); localStorage.setItem(KEEP + '_t', String(Date.now())); } catch (_) {}
    track(ref.id);
  } catch (e) { b.disabled = false; b.textContent = 'Request help'; err.textContent = e && e.code === 'permission-denied' ? 'This workshop just stopped taking online requests — please call them.' : 'Something went wrong: ' + (e.message || e); }
}
const LABEL = { new: ['Request received', ''], accepted: ['Help is being arranged', 'go'], on_the_way: ['Driver is on the way', 'go'], arrived: ['Driver has arrived', 'go'], done: ['Completed', 'go'], cancelled: ['Cancelled', 'bad'], declined: ['Couldn\'t take this one', 'bad'] };
function track(id) {
  clearInterval(poll);
  const draw = r => {
    const st = LABEL[r.status] || LABEL.new, mins = Number(H.callback_mins) || 15;
    $('app').innerHTML = `<h1>${esc(H.name || 'Breakdown help')}</h1>
      <div class="card"><span class="stat ${st[1]}">${esc(st[0])}</span>
        <div class="big">${r.status === 'new' ? `We'll call you within ${mins} minutes` : r.status === 'accepted' ? `${esc(r.driver || 'A driver')} is assigned${r.eta_min ? ' — about ' + esc(r.eta_min) + ' min away' : ''}` : r.status === 'on_the_way' ? `${esc(r.driver || 'Your driver')} is on the way${r.eta_min ? ' (about ' + esc(r.eta_min) + ' min)' : ''}` : r.status === 'arrived' ? 'Your driver is with you' : r.status === 'done' ? 'All done — we hope you\'re back on the road' : r.status === 'declined' ? 'Sorry — please call the workshop' : 'Request cancelled'}</div>
        <p class="sub" style="margin:0">Keep your phone nearby and stay somewhere safe. ${r.reply ? '<br><b>Message from the workshop:</b> ' + esc(r.reply) : ''}</p>
        <div class="pills">${H.phone ? `<a class="pill" href="tel:${esc(H.phone)}">📞 Call the workshop</a>` : ''}${r.driver_phone && ['accepted', 'on_the_way', 'arrived'].includes(r.status) ? `<a class="pill" href="tel:${esc(r.driver_phone)}">📞 Call ${esc(r.driver || 'driver')}</a>` : ''}</div>
        ${['new', 'accepted'].includes(r.status) ? `<button class="btn ghost" id="cx" type="button">Cancel this request</button>` : `<button class="btn ghost" id="again" type="button">Make a new request</button>`}
      </div>`;
    const cx = $('cx'); if (cx) cx.onclick = async () => { cx.disabled = true; try { await db.collection('users').doc(H.uid).collection('breakdown_requests').doc(id).update({ status: 'cancelled', cancel_note: 'Cancelled by customer' }); tick(); } catch (e) { cx.disabled = false; } };
    const ag = $('again'); if (ag) ag.onclick = () => { try { localStorage.removeItem(KEEP); localStorage.removeItem(KEEP + '_t'); } catch (_) {} clearInterval(poll); form(); };
  };
  const tick = async () => { try { const s = await db.collection('users').doc(H.uid).collection('breakdown_requests').doc(id).get(); if (!s.exists) { try { localStorage.removeItem(KEEP); } catch (_) {} clearInterval(poll); return form(); } draw(s.data()); } catch (_) {} };
  tick(); poll = setInterval(() => { if (!document.hidden) tick(); }, 8000);
}
load();
</script>
<script src="i18n/gp-lang.js"></script>
<script src="gp-busy.js"></script>
</body>
</html>
