<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Approve your estimate · Garage Pro</title>
<style>
  :root{
    --bg:#0a0e14; --bg2:#121722; --surf:#171d2a; --brd:#26303f; --brd2:#324056;
    --txt:#e7ecf3; --dim:#9fb0c6; --faint:#69788f;
    --acc:#ff7a18; --acc2:#ff9a45; --teal:#20e3b2; --red:#ff6b6b; --blue:#639fff;
    --fb:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--fb);-webkit-font-smoothing:antialiased}
  a{color:var(--acc2)}
  .wrap{max-width:620px;margin:0 auto;padding:20px 16px 60px}
  .brand{display:flex;align-items:center;gap:10px;padding:14px 0 18px;border-bottom:1px solid var(--brd);margin-bottom:18px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:800;color:#0a0e14;font-size:17px}
  .ws{font-weight:700;font-size:15.5px}
  .sub{font-size:12px;color:var(--faint)}
  h1{font-size:20px;margin:4px 0 6px}
  .lead{color:var(--dim);font-size:13.5px;line-height:1.55;margin-bottom:18px}
  .vehcard{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:12px 14px;margin-bottom:18px}
  .plate{font-family:'Courier New',monospace;font-weight:800;letter-spacing:1px;background:#e7ecf3;color:#0a0e14;padding:5px 10px;border-radius:6px;font-size:15px}
  .item{border:1px solid var(--brd);border-radius:12px;padding:13px 14px;margin-bottom:10px;transition:border-color .15s,background .15s}
  .item.approved{border-color:rgba(32,227,178,.55);background:rgba(32,227,178,.07)}
  .item.rejected{border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.07)}
  .item.locked{border-color:rgba(32,227,178,.35);background:rgba(32,227,178,.05);opacity:.9}
  .locked-tag{margin-top:9px;font-size:12px;font-weight:700;color:var(--teal);display:flex;align-items:center;gap:6px}
  .revnote{background:rgba(32,227,178,.08);border:1px solid rgba(32,227,178,.3);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.5}
  .item-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .item-name{font-weight:700;font-size:14.5px}
  .item-meta{font-size:12px;color:var(--faint);margin-top:2px}
  .amt{font-family:'Courier New',monospace;font-weight:800;font-size:15px;white-space:nowrap}
  .btns{display:flex;gap:8px;margin-top:11px}
  .btn{flex:1;padding:10px;border-radius:9px;border:1px solid var(--brd2);background:var(--surf);color:var(--dim);font-family:var(--fb);font-weight:700;font-size:13.5px;cursor:pointer;transition:all .12s}
  .btn:active{transform:scale(.98)}
  .item.approved .btn.approve,.btn.approve.on{background:var(--teal);border-color:var(--teal);color:#04231b}
  .item.rejected .btn.reject,.btn.reject.on{background:var(--red);border-color:var(--red);color:#2a0808}
  .photos{display:flex;gap:8px;overflow-x:auto;margin-top:11px;padding-bottom:4px}
  .photos img{height:92px;border-radius:9px;border:1px solid var(--brd);cursor:zoom-in;flex:0 0 auto}
  .bulk{display:flex;gap:8px;margin:6px 0 16px}
  .bulk .btn{font-size:12.5px;padding:9px}
  .totrow{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-top:1px solid var(--brd);margin-top:8px;font-size:14px}
  .totrow .amt{font-size:20px;color:var(--acc2)}
  .note{width:100%;background:var(--bg2);border:1px solid var(--brd);border-radius:10px;color:var(--txt);font-family:var(--fb);font-size:13.5px;padding:11px 12px;resize:vertical;min-height:64px;margin:6px 0 18px}
  .submit{width:100%;padding:15px;border-radius:12px;border:0;font-family:var(--fb);font-weight:800;font-size:15.5px;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0a0e14}
  .submit:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
  .hint{text-align:center;font-size:12px;color:var(--faint);margin-top:10px;min-height:16px}
  .state{text-align:center;padding:60px 20px;color:var(--dim)}
  .dot{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:var(--acc);animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .done{text-align:center;padding:48px 20px}
  .done .tick{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;font-size:34px}
  .done.ok .tick{background:rgba(32,227,178,.14);color:var(--teal)}
  .done.no .tick{background:rgba(255,107,107,.14);color:var(--red)}
  .summary-pill{display:inline-block;padding:4px 11px;border-radius:100px;font-size:12px;font-weight:700;margin:3px}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;place-items:center;z-index:50;padding:20px}
  .lb img{max-width:100%;max-height:100%;border-radius:10px}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="state"><div class="dot"></div>Loading your estimate…</div>
</div>
<div class="lb" id="lightbox" onclick="this.style.display='none'"><img id="lbImg" alt="" /></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const FB_CONFIG = {
  apiKey: "AIzaSyA1PzbhboU9Qdlpqs5cbLR3hsvFpWXCI54",
  authDomain: "garagepro26.firebaseapp.com",
  projectId: "garagepro26",
  storageBucket: "garagepro26.firebasestorage.app",
  messagingSenderId: "605094681607",
  appId: "1:605094681607:web:095fbfb8ff0446faaedea2"
};

const root = document.getElementById('root');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs = new URLSearchParams(location.search);
const WUID  = qs.get('w') || '';
const TOKEN = qs.get('t') || '';

let db = null, docRef = null, DATA = null, CUR = '₹';
const decisions = {};   // key -> 'approved' | 'rejected'

function fmt(n){ return CUR + Number(n||0).toLocaleString('en-IN'); }
function stateMsg(html){ root.innerHTML = `<div class="state">${html}</div>`; }

function boot(){
  if (!WUID || !TOKEN) { stateMsg('This link is incomplete. Please ask the workshop to resend it.'); return; }
  try {
    firebase.initializeApp(FB_CONFIG);
    db = firebase.firestore();
  } catch (e) { stateMsg('Could not connect. Please try again in a moment.'); return; }
  docRef = db.collection('users').doc(WUID).collection('estimate_approvals').doc(TOKEN);
  docRef.get().then(snap => {
    if (!snap.exists) { stateMsg('This estimate link is no longer valid. Please ask the workshop for an updated link.'); return; }
    DATA = snap.data() || {};
    CUR = DATA.currency || '₹';
    // A previous response doesn't permanently lock the page — only once
    // there's nothing left open (every item is either approved or dropped) is
    // there truly nothing left to decide. Otherwise a rejected item is still
    // revisable: reopen the link, tap Approve, submit again.
    if (DATA.responded_at && !hasOpenItems()) { renderDone(); return; }
    // Rejected items keep their decision pre-filled (not forced into a "please
    // choose again" state) — the customer only has to actively decide the
    // ones still pending; a rejected item stays rejected unless they change it.
    (DATA.lines   || []).forEach((l, i) => { if (l.state === 'rejected') decisions['line:' + i]   = 'rejected'; });
    (DATA.charges || []).forEach((c, i) => { if (c.state === 'rejected') decisions['charge:' + i] = 'rejected'; });
    render();
  }).catch(e => {
    console.error('[approve] load failed:', e && e.code, e);
    if (e && e.code === 'permission-denied') {
      // The workshop's Firestore security rules don't yet allow public reads of
      // estimate_approvals — the rules need to be (re)published.
      stateMsg(`This estimate link isn't active yet.<br><span style="font-size:12.5px;color:var(--faint)">The workshop needs to publish the latest security rules. Please contact them.</span>`);
    } else {
      stateMsg(`Couldn't load this estimate.<br><span style="font-size:12.5px;color:var(--faint)">Please check your connection and refresh. (${esc((e && e.code) || 'error')})</span>`);
    }
  });
}

function brandHead(){
  const initial = (DATA.workshop_name || 'G').trim().charAt(0).toUpperCase();
  return `<div class="brand">
    <div class="logo">${esc(initial)}</div>
    <div><div class="ws">${esc(DATA.workshop_name || 'Workshop')}</div><div class="sub">Repair estimate</div></div>
  </div>`;
}

function itemHTML(kind, i, name, meta, exclGst, gstAmt, amount, state){
  state = state || 'pending';
  // Only items the workshop explicitly dropped from the quote disappear —
  // rejected items stay visible and revisable (see the 'rejected' case below).
  if (state === 'dropped') return '';
  const key = kind + ':' + i;
  const gstLine = gstAmt > 0
    ? `<div class="item-meta">${meta ? esc(meta) + ' · ' : ''}${fmt(exclGst)} + GST ${fmt(gstAmt)}</div>`
    : (meta ? `<div class="item-meta">${esc(meta)}</div>` : '');
  // Already approved in an earlier round → shown read-only for context, no buttons.
  if (state === 'approved'){
    return `<div class="item locked" id="it-${esc(key)}">
      <div class="item-top">
        <div><div class="item-name">${esc(name)}</div>${gstLine}</div>
        <div class="amt">${fmt(amount)}</div>
      </div>
      <div class="locked-tag">✓ Already approved</div>
    </div>`;
  }
  // Pending items start with no visible decision; a previously-rejected item
  // stays marked rejected (decisions[key] is pre-filled in boot()) but is
  // still fully interactive — tapping Approve here is exactly how a customer
  // changes their mind on something they declined earlier.
  const st = decisions[key] || '';
  const changedMindNote = state === 'rejected'
    ? `<div class="item-meta" style="color:var(--red);margin-top:4px">You previously declined this — tap Approve if you've changed your mind.</div>`
    : '';
  return `<div class="item ${st}" id="it-${esc(key)}">
    <div class="item-top">
      <div><div class="item-name">${esc(name)}</div>${gstLine}${changedMindNote}</div>
      <div class="amt">${fmt(amount)}</div>
    </div>
    <div class="btns">
      <button class="btn approve ${st==='approved'?'on':''}" onclick="setDec('${esc(key)}','approved')">✓ Approve</button>
      <button class="btn reject ${st==='rejected'?'on':''}" onclick="setDec('${esc(key)}','rejected')">✕ Reject</button>
    </div>
  </div>`;
}

function _isOpenState(s){ s = s || 'pending'; return s === 'pending' || s === 'rejected'; }
// Which items the customer can currently act on — pending (never decided) AND
// rejected (decided, but still revisable). Locked-approved and dropped items
// are excluded from the gate; rejected items count here even though they
// already have a decision, so the "everything decided" gate isn't blocked by
// them, but they still show up so the customer CAN act on them.
function askableCount(){
  let n = 0;
  (DATA.lines||[]).forEach(l => { if (_isOpenState(l.state)) n++; });
  (DATA.charges||[]).forEach(c => { if (_isOpenState(c.state)) n++; });
  return n;
}
function lockedApprovedCount(){
  let n = 0;
  (DATA.lines||[]).forEach(l => { if (l.state==='approved') n++; });
  (DATA.charges||[]).forEach(c => { if (c.state==='approved') n++; });
  return n;
}
// Is there anything left the customer could still change? True while any
// item is pending (never decided) or rejected (revisable) — false once
// everything is either approved or dropped, i.e. genuinely finished.
function hasOpenItems(){
  return (DATA.lines||[]).some(l => _isOpenState(l.state)) || (DATA.charges||[]).some(c => _isOpenState(c.state));
}
// Display order for a re-sent estimate: already-approved items pinned to the
// top (locked, shown for reference/total context), then pending/rejected
// items the customer still needs to act on — original array position is the
// tiebreaker within each group. Returns INDICES into the original array (not
// reordered objects) so callers can still key decisions off the real index.
function _apprOrder(arr){
  return (arr||[]).map((x,i)=>i).sort((ai,bi)=>{
    const a = arr[ai], b = arr[bi];
    const rank = s => s === 'approved' ? 0 : 1;
    const r = rank(a.state) - rank(b.state);
    return r !== 0 ? r : ai - bi;
  });
}

// Top-down car outline — matches the workshop app's intake diagram so pins
// land in the same spots. Read-only here.
function _apprCarSVG(){
  return `<svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;color:var(--faint);pointer-events:none">
    <rect x="30" y="20" width="140" height="360" rx="35" fill="none" stroke="currentColor" stroke-width="3"/>
    <rect x="34" y="55" width="132" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
    <rect x="34" y="145" width="132" height="110" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
    <rect x="34" y="275" width="132" height="65" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
    <rect x="8" y="72" width="16" height="52" rx="6" fill="currentColor" opacity=".5"/>
    <rect x="176" y="72" width="16" height="52" rx="6" fill="currentColor" opacity=".5"/>
    <rect x="8" y="276" width="16" height="52" rx="6" fill="currentColor" opacity=".5"/>
    <rect x="176" y="276" width="16" height="52" rx="6" fill="currentColor" opacity=".5"/>
    <text x="100" y="42" text-anchor="middle" font-size="12" fill="currentColor" opacity=".6">FRONT</text>
    <text x="100" y="365" text-anchor="middle" font-size="12" fill="currentColor" opacity=".6">REAR</text>
  </svg>`;
}
function _apprDamageHTML(){
  const pins = DATA.damage_pins || [];
  if (!pins.length) return '';
  return `<div style="margin:4px 0 16px;padding:14px;background:var(--bg2);border:1px solid var(--brd);border-radius:12px">
    <div style="font-weight:700;font-size:13.5px;color:var(--txt);margin-bottom:4px">Damage noted at drop-off</div>
    <div style="font-size:12px;color:var(--faint);margin-bottom:12px">These marks were recorded when you handed the vehicle over. If anything looks wrong, please tell us before approving.</div>
    <div style="position:relative;width:130px;height:260px;margin:0 auto 12px">${_apprCarSVG()}
      ${pins.map((p,i)=>`<div title="${esc(p.type)}${p.note?': '+esc(p.note):''}" style="position:absolute;left:${p.x}%;top:${p.y}%;transform:translate(-50%,-50%);width:19px;height:19px;border-radius:50%;background:var(--red);border:2px solid #fff;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center">${i+1}</div>`).join('')}
    </div>
    <div style="display:grid;gap:6px">
      ${pins.map((p,i)=>`<div style="font-size:12.5px;color:var(--dim)"><b style="color:var(--red)">${i+1}.</b> ${esc(p.type)}${p.note?' — '+esc(p.note):''}</div>`).join('')}
    </div>
  </div>`;
}

function render(){
  const lines   = DATA.lines   || [];
  const charges = DATA.charges || [];
  const photos  = DATA.photos  || [];
  const veh = [DATA.plate, DATA.veh_desc].filter(Boolean);

  root.innerHTML = `
    ${brandHead()}
    <h1>Hi${DATA.cust_name ? ' ' + esc(DATA.cust_name) : ''}, please review your estimate</h1>
    <div class="lead">We've inspected your vehicle and prepared the estimate below. Approve the work you'd like us to carry out and reject anything you'd prefer to skip. Your choices are sent straight to our team.</div>
    ${((DATA.revision||1) > 1 || lockedApprovedCount() > 0)
      ? `<div class="revnote"><b>Updated estimate.</b> We've revised the item(s) you'd asked us to look at again — please review just those below. Anything marked <b style="color:var(--teal)">✓ Already approved</b> is confirmed and shown only for your reference.</div>`
      : ''}

    <div class="vehcard">
      ${DATA.plate ? `<span class="plate">${esc(DATA.plate)}</span>` : ''}
      <div style="flex:1"><div style="font-weight:700;font-size:13.5px">${esc(DATA.veh_desc || 'Your vehicle')}</div>
      ${DATA.invoice_no ? `<div class="sub">Estimate ${esc(DATA.invoice_no)}</div>` : ''}</div>
      <button class="btn" style="flex:0 0 auto;width:auto;padding:9px 13px" onclick="viewQuote()">📄 View estimate</button>
    </div>

    ${photos.length ? `<div class="photos">${photos.map(p => `<img src="${esc(p.data)}" alt="${esc(p.caption||'')}" onclick="zoom('${esc(p.data)}')" />`).join('')}</div>` : ''}

    ${_apprDamageHTML()}

    <div class="bulk">
      <button class="btn approve" onclick="bulk('approved')">Approve all</button>
      <button class="btn reject" onclick="bulk('rejected')">Reject all</button>
    </div>

    <div id="items">
      ${_apprOrder(lines).map(i => { const l = lines[i]; return itemHTML('line', i, l.name + (l.qty>1?' × '+l.qty:''), l.concern_title || 'Part', l.amount_excl_gst ?? l.amount, l.gst_amount || 0, l.amount, l.state); }).join('')}
      ${_apprOrder(charges).map(i => { const c = charges[i]; return itemHTML('charge', i, c.name, c.concern_title || 'Service / labour', c.amount_excl_gst ?? c.amount, c.gst_amount || 0, c.amount, c.state); }).join('')}
    </div>

    <div class="totrow"><span style="color:var(--dim)">Estimate total</span><span class="amt">${fmt(DATA.total)}</span></div>
    <div style="font-size:12px;color:var(--dim);text-align:right;margin-top:-6px;margin-bottom:14px">${(DATA.total_gst || 0) > 0 ? `Prices include GST${DATA.tax_pct ? ' (' + DATA.tax_pct + '%)' : ''} — ${fmt(DATA.total_gst)} of the total above is GST.` : 'No GST applies to this estimate.'}</div>

    <textarea class="note" id="note" placeholder="Anything you'd like to tell the workshop? (optional)"></textarea>

    <button class="submit" id="submitBtn" disabled onclick="submit()">Submit my decision</button>
    <div class="hint" id="hint">Please choose Approve or Reject for every item above.</div>
  `;
  refresh();
}

window.zoom = function(src){ document.getElementById('lbImg').src = src; document.getElementById('lightbox').style.display = 'grid'; };

// Open a printable formal quote built from the approval payload. Loaded via a
// Blob URL so the tab has a real URL (no "about:blank" in the print footer);
// the customer can print or save-as-PDF from the browser.
window.viewQuote = function(){
  // Dropped items are no longer part of the quote — leave them off the printout.
  const inScope = x => (x.state || 'pending') !== 'dropped';
  const rows = []
    .concat((DATA.lines||[]).filter(inScope).map(l => ({ name: l.name + (l.qty>1 ? ' × '+l.qty : ''), kind:'Part', exclGst: l.amount_excl_gst ?? l.amount, gst: l.gst_amount || 0, amount:l.amount })))
    .concat((DATA.charges||[]).filter(inScope).map(c => ({ name: c.name, kind:'Service / labour', exclGst: c.amount_excl_gst ?? c.amount, gst: c.gst_amount || 0, amount:c.amount })));
  const today = new Date().toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>Estimate ${esc(DATA.invoice_no || '')} · ${esc(DATA.workshop_name || '')}</title>
  <style>
    @page{size:auto;margin:0mm}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#111;margin:0;padding:36px 42px;background:#fff}
    .top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #111;padding-bottom:16px;margin-bottom:22px}
    h1{font-size:22px;margin:0}
    .tag{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#666}
    .meta{font-size:12.5px;color:#444;line-height:1.7}
    table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
    th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#666;border-bottom:2px solid #111;padding:8px 6px}
    th:last-child,td:last-child{text-align:right}
    td{padding:9px 6px;border-bottom:1px solid #ddd}
    .tot td{border-bottom:0;border-top:2px solid #111;font-weight:800;font-size:15px;padding-top:12px}
    .note{margin-top:26px;font-size:11.5px;color:#666;line-height:1.6}
    .toolbar{position:fixed;top:12px;right:12px}
    .toolbar button{font-family:inherit;font-size:12px;font-weight:700;padding:8px 14px;border-radius:6px;border:0;cursor:pointer;background:#111;color:#fff}
    @media print{.toolbar{display:none}}
  </style></head><body>
    <div class="toolbar"><button onclick="window.print()">Print / Save PDF</button></div>
    <div class="top">
      <div><div class="tag">Repair estimate</div><h1>${esc(DATA.workshop_name || 'Workshop')}</h1>
      ${DATA.workshop_phone ? `<div class="meta">${esc(DATA.workshop_phone)}</div>` : ''}</div>
      <div class="meta" style="text-align:right">
        ${DATA.invoice_no ? `<b>${esc(DATA.invoice_no)}</b><br>` : ''}${esc(today)}<br>
        ${DATA.cust_name ? esc(DATA.cust_name) + '<br>' : ''}${esc(DATA.plate || '')}${DATA.veh_desc ? ' · ' + esc(DATA.veh_desc) : ''}
      </div>
    </div>
    <table>
      <thead><tr><th>Item</th><th>Type</th><th>Price (excl. GST)</th><th>GST</th><th>Price (incl. GST)</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.kind)}</td><td>${esc(fmt(r.exclGst))}</td><td>${r.gst > 0 ? esc(fmt(r.gst)) : '—'}</td><td>${esc(fmt(r.amount))}</td></tr>`).join('')}
        <tr class="tot"><td colspan="4">Estimate total</td><td>${esc(fmt(DATA.total))}</td></tr>
      </tbody>
    </table>
    <div class="note">This is an estimate, not a final bill. Only the items you approve will be carried out and billed. ${(DATA.total_gst || 0) > 0 ? `Prices include GST${DATA.tax_pct ? ' (' + DATA.tax_pct + '%)' : ''} — ${esc(fmt(DATA.total_gst))} of the total is GST, shown per item above.` : 'No GST applies to this estimate.'}</div>
  </body></html>`;
  try {
    const url = URL.createObjectURL(new Blob([html], { type:'text/html' }));
    const w = window.open(url, '_blank');
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(_){} }, 60000);
    if (!w) alert('Your browser blocked the new tab — allow pop-ups to view the estimate.');
  } catch(e) { alert('Could not open the estimate: ' + e.message); }
};

window.setDec = function(key, val){
  decisions[key] = decisions[key] === val ? undefined : val;
  if (decisions[key] === undefined) delete decisions[key];
  const el = document.getElementById('it-' + key);
  if (el){
    el.classList.remove('approved','rejected');
    if (decisions[key]) el.classList.add(decisions[key]);
    el.querySelectorAll('.btn').forEach(b => b.classList.remove('on'));
    if (decisions[key]==='approved') el.querySelector('.btn.approve').classList.add('on');
    if (decisions[key]==='rejected') el.querySelector('.btn.reject').classList.add('on');
  }
  refresh();
};

window.bulk = function(val){
  // Pending AND rejected items — locked-approved rows stay put. Rejected is
  // included so "Approve all" can also sweep up anything declined earlier.
  (DATA.lines||[]).forEach((l,i) => { if (_isOpenState(l.state)) decisions['line:'+i] = val; });
  (DATA.charges||[]).forEach((c,i) => { if (_isOpenState(c.state)) decisions['charge:'+i] = val; });
  document.querySelectorAll('.item').forEach(el => {
    if (el.classList.contains('locked')) return;
    el.classList.remove('approved','rejected'); el.classList.add(val);
    el.querySelectorAll('.btn').forEach(b => b.classList.remove('on'));
    el.querySelector('.btn.' + (val==='approved'?'approve':'reject')).classList.add('on');
  });
  refresh();
};

function decidedCount(){ return Object.keys(decisions).length; }

function refresh(){
  const btn = document.getElementById('submitBtn');
  const hint = document.getElementById('hint');
  if (!btn) return;
  const total = askableCount();
  const all = decidedCount() === total && total > 0;
  btn.disabled = !all;
  if (!all){ hint.textContent = `Choose Approve or Reject for every item (${decidedCount()}/${total} done).`; return; }
  const app = Object.values(decisions).filter(v=>v==='approved').length;
  const rej = total - app;
  const totalApp = app + lockedApprovedCount();   // include items approved in an earlier round
  btn.textContent = totalApp === 0 ? 'Submit — reject all work' : (rej === 0 ? 'Approve all & submit' : `Submit — approve ${app}, reject ${rej}`);
  hint.textContent = totalApp === 0 ? 'You are rejecting the whole estimate.' : (rej ? 'Only the approved items will be carried out.' : 'All work approved.');
}

window.submit = async function(){
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  const app = Object.values(decisions).filter(v=>v==='approved').length;
  const rej = askableCount() - app;
  const totalApp = app + lockedApprovedCount();
  const status = totalApp === 0 ? 'rejected' : (rej === 0 ? 'approved' : 'partial');
  try {
    await docRef.update({
      decisions,
      status,
      customer_note: (document.getElementById('note').value || '').slice(0, 500),
      responded_at: new Date().toISOString().slice(0,19).replace('T',' ')
    });
    DATA.status = status; DATA._app = app; DATA._rej = rej;
    renderDone();
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.textContent = 'Submit my decision';
    document.getElementById('hint').innerHTML = '<span style="color:var(--red)">Could not submit — please check your connection and try again.</span>';
  }
};

function renderDone(){
  const status = DATA.status || 'approved';
  const rejectedAll = status === 'rejected';
  const app = DATA._app, rej = DATA._rej;
  root.innerHTML = `
    ${brandHead()}
    <div class="done ${rejectedAll ? 'no' : 'ok'}">
      <div class="tick">${rejectedAll ? '✕' : '✓'}</div>
      <h1 style="margin-bottom:8px">${rejectedAll ? 'Estimate declined' : 'Thank you — decision received'}</h1>
      <div class="lead" style="margin:0 auto;max-width:420px">
        ${rejectedAll
          ? `We've let ${esc(DATA.workshop_name || 'the workshop')} know you'd prefer not to proceed. They'll reassemble your vehicle and be in touch about pickup.`
          : `${esc(DATA.workshop_name || 'The workshop')} has been notified and will begin the approved work. ${(typeof app==='number' && app>0 && rej>0) ? 'The declined items will be skipped.' : ''}`}
      </div>
      ${(typeof app === 'number') ? `<div style="margin-top:14px">
        ${app>0 ? `<span class="summary-pill" style="background:rgba(32,227,178,.14);color:var(--teal)">${app} approved</span>`:''}
        ${rej>0 ? `<span class="summary-pill" style="background:rgba(255,107,107,.14);color:var(--red)">${rej} declined</span>`:''}
      </div>` : ''}
      ${rej > 0 ? `<div class="sub" style="margin-top:14px;max-width:420px;margin-left:auto;margin-right:auto">Changed your mind on something you declined? Reopen this same link any time to approve it.</div>` : ''}
      ${DATA.workshop_phone ? `<div class="sub" style="margin-top:20px">Questions? Call ${esc(DATA.workshop_phone)}</div>` : ''}
    </div>`;
}

boot();
</script>
</body>
</html>
