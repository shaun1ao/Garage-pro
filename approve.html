<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Approve your estimate · Garage Pro</title>
<style>
  :root{
    --bg:#0a0e14; --bg2:#121722; --surf:#171d2a; --brd:#26303f; --brd2:#324056;
    --txt:#e7ecf3; --dim:#9fb0c6; --faint:#69788f;
    --acc:#ff7a18; --acc2:#ff9a45; --teal:#20e3b2; --red:#ff6b6b; --blue:#639fff;
    --fb:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--fb);-webkit-font-smoothing:antialiased}
  a{color:var(--acc2)}
  .wrap{max-width:620px;margin:0 auto;padding:20px 16px 60px}
  .brand{display:flex;align-items:center;gap:10px;padding:14px 0 18px;border-bottom:1px solid var(--brd);margin-bottom:18px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:800;color:#0a0e14;font-size:17px}
  .ws{font-weight:700;font-size:15.5px}
  .sub{font-size:12px;color:var(--faint)}
  h1{font-size:20px;margin:4px 0 6px}
  .lead{color:var(--dim);font-size:13.5px;line-height:1.55;margin-bottom:18px}
  .vehcard{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:12px 14px;margin-bottom:18px}
  .plate{font-family:'Courier New',monospace;font-weight:800;letter-spacing:1px;background:#e7ecf3;color:#0a0e14;padding:5px 10px;border-radius:6px;font-size:15px}
  .item{border:1px solid var(--brd);border-radius:12px;padding:13px 14px;margin-bottom:10px;transition:border-color .15s,background .15s}
  .item.approved{border-color:rgba(32,227,178,.55);background:rgba(32,227,178,.07)}
  .item.rejected{border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.07)}
  .item-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .item-name{font-weight:700;font-size:14.5px}
  .item-meta{font-size:12px;color:var(--faint);margin-top:2px}
  .amt{font-family:'Courier New',monospace;font-weight:800;font-size:15px;white-space:nowrap}
  .btns{display:flex;gap:8px;margin-top:11px}
  .btn{flex:1;padding:10px;border-radius:9px;border:1px solid var(--brd2);background:var(--surf);color:var(--dim);font-family:var(--fb);font-weight:700;font-size:13.5px;cursor:pointer;transition:all .12s}
  .btn:active{transform:scale(.98)}
  .item.approved .btn.approve,.btn.approve.on{background:var(--teal);border-color:var(--teal);color:#04231b}
  .item.rejected .btn.reject,.btn.reject.on{background:var(--red);border-color:var(--red);color:#2a0808}
  .photos{display:flex;gap:8px;overflow-x:auto;margin-top:11px;padding-bottom:4px}
  .photos img{height:92px;border-radius:9px;border:1px solid var(--brd);cursor:zoom-in;flex:0 0 auto}
  .bulk{display:flex;gap:8px;margin:6px 0 16px}
  .bulk .btn{font-size:12.5px;padding:9px}
  .totrow{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-top:1px solid var(--brd);margin-top:8px;font-size:14px}
  .totrow .amt{font-size:20px;color:var(--acc2)}
  .note{width:100%;background:var(--bg2);border:1px solid var(--brd);border-radius:10px;color:var(--txt);font-family:var(--fb);font-size:13.5px;padding:11px 12px;resize:vertical;min-height:64px;margin:6px 0 18px}
  .submit{width:100%;padding:15px;border-radius:12px;border:0;font-family:var(--fb);font-weight:800;font-size:15.5px;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0a0e14}
  .submit:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
  .hint{text-align:center;font-size:12px;color:var(--faint);margin-top:10px;min-height:16px}
  .state{text-align:center;padding:60px 20px;color:var(--dim)}
  .dot{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:var(--acc);animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .done{text-align:center;padding:48px 20px}
  .done .tick{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;font-size:34px}
  .done.ok .tick{background:rgba(32,227,178,.14);color:var(--teal)}
  .done.no .tick{background:rgba(255,107,107,.14);color:var(--red)}
  .summary-pill{display:inline-block;padding:4px 11px;border-radius:100px;font-size:12px;font-weight:700;margin:3px}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;place-items:center;z-index:50;padding:20px}
  .lb img{max-width:100%;max-height:100%;border-radius:10px}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="state"><div class="dot"></div>Loading your estimate…</div>
</div>
<div class="lb" id="lightbox" onclick="this.style.display='none'"><img id="lbImg" alt="" /></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const FB_CONFIG = {
  apiKey: "AIzaSyD4rRHyT3NOxTfwQDy3mjv9HVYUH3riGDA",
  authDomain: "garage-pro-874c6.firebaseapp.com",
  projectId: "garage-pro-874c6",
  storageBucket: "garage-pro-874c6.firebasestorage.app",
  messagingSenderId: "714982026183",
  appId: "1:714982026183:web:95401fffb0a93151b407e2"
};

const root = document.getElementById('root');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs = new URLSearchParams(location.search);
const WUID  = qs.get('w') || '';
const TOKEN = qs.get('t') || '';

let db = null, docRef = null, DATA = null, CUR = '₹';
const decisions = {};   // key -> 'approved' | 'rejected'

function fmt(n){ return CUR + Number(n||0).toLocaleString('en-IN'); }
function stateMsg(html){ root.innerHTML = `<div class="state">${html}</div>`; }

function boot(){
  if (!WUID || !TOKEN) { stateMsg('This link is incomplete. Please ask the workshop to resend it.'); return; }
  try {
    firebase.initializeApp(FB_CONFIG);
    db = firebase.firestore();
  } catch (e) { stateMsg('Could not connect. Please try again in a moment.'); return; }
  docRef = db.collection('users').doc(WUID).collection('estimate_approvals').doc(TOKEN);
  docRef.get().then(snap => {
    if (!snap.exists) { stateMsg('This estimate link is no longer valid. Please ask the workshop for an updated link.'); return; }
    DATA = snap.data() || {};
    CUR = DATA.currency || '₹';
    if (DATA.responded_at) { renderDone(); return; }
    render();
  }).catch(e => {
    console.error('[approve] load failed:', e && e.code, e);
    if (e && e.code === 'permission-denied') {
      // The workshop's Firestore security rules don't yet allow public reads of
      // estimate_approvals — the rules need to be (re)published.
      stateMsg(`This estimate link isn't active yet.<br><span style="font-size:12.5px;color:var(--faint)">The workshop needs to publish the latest security rules. Please contact them.</span>`);
    } else {
      stateMsg(`Couldn't load this estimate.<br><span style="font-size:12.5px;color:var(--faint)">Please check your connection and refresh. (${esc((e && e.code) || 'error')})</span>`);
    }
  });
}

function brandHead(){
  const initial = (DATA.workshop_name || 'G').trim().charAt(0).toUpperCase();
  return `<div class="brand">
    <div class="logo">${esc(initial)}</div>
    <div><div class="ws">${esc(DATA.workshop_name || 'Workshop')}</div><div class="sub">Repair estimate</div></div>
  </div>`;
}

function itemHTML(kind, i, name, meta, amount){
  const key = kind + ':' + i;
  const st = decisions[key] || '';
  return `<div class="item ${st}" id="it-${esc(key)}">
    <div class="item-top">
      <div><div class="item-name">${esc(name)}</div>${meta ? `<div class="item-meta">${esc(meta)}</div>` : ''}</div>
      <div class="amt">${fmt(amount)}</div>
    </div>
    <div class="btns">
      <button class="btn approve ${st==='approved'?'on':''}" onclick="setDec('${esc(key)}','approved')">✓ Approve</button>
      <button class="btn reject ${st==='rejected'?'on':''}" onclick="setDec('${esc(key)}','rejected')">✕ Reject</button>
    </div>
  </div>`;
}

function render(){
  const lines   = DATA.lines   || [];
  const charges = DATA.charges || [];
  const photos  = DATA.photos  || [];
  const veh = [DATA.plate, DATA.veh_desc].filter(Boolean);

  root.innerHTML = `
    ${brandHead()}
    <h1>Hi${DATA.cust_name ? ' ' + esc(DATA.cust_name) : ''}, please review your estimate</h1>
    <div class="lead">We've inspected your vehicle and prepared the estimate below. Approve the work you'd like us to carry out and reject anything you'd prefer to skip. Your choices are sent straight to our team.</div>

    <div class="vehcard">
      ${DATA.plate ? `<span class="plate">${esc(DATA.plate)}</span>` : ''}
      <div><div style="font-weight:700;font-size:13.5px">${esc(DATA.veh_desc || 'Your vehicle')}</div>
      ${DATA.invoice_no ? `<div class="sub">Estimate ${esc(DATA.invoice_no)}</div>` : ''}</div>
    </div>

    ${photos.length ? `<div class="photos">${photos.map(p => `<img src="${esc(p.data)}" alt="${esc(p.caption||'')}" onclick="zoom('${esc(p.data)}')" />`).join('')}</div>` : ''}

    <div class="bulk">
      <button class="btn approve" onclick="bulk('approved')">Approve all</button>
      <button class="btn reject" onclick="bulk('rejected')">Reject all</button>
    </div>

    <div id="items">
      ${lines.map((l,i) => itemHTML('line', i, l.name + (l.qty>1?' × '+l.qty:''), 'Part', l.amount)).join('')}
      ${charges.map((c,i) => itemHTML('charge', i, c.name, 'Service / labour', c.amount)).join('')}
    </div>

    <div class="totrow"><span style="color:var(--dim)">Estimate total</span><span class="amt">${fmt(DATA.total)}</span></div>

    <textarea class="note" id="note" placeholder="Anything you'd like to tell the workshop? (optional)"></textarea>

    <button class="submit" id="submitBtn" disabled onclick="submit()">Submit my decision</button>
    <div class="hint" id="hint">Please choose Approve or Reject for every item above.</div>
  `;
  refresh();
}

window.zoom = function(src){ document.getElementById('lbImg').src = src; document.getElementById('lightbox').style.display = 'grid'; };

window.setDec = function(key, val){
  decisions[key] = decisions[key] === val ? undefined : val;
  if (decisions[key] === undefined) delete decisions[key];
  const el = document.getElementById('it-' + key);
  if (el){
    el.classList.remove('approved','rejected');
    if (decisions[key]) el.classList.add(decisions[key]);
    el.querySelectorAll('.btn').forEach(b => b.classList.remove('on'));
    if (decisions[key]==='approved') el.querySelector('.btn.approve').classList.add('on');
    if (decisions[key]==='rejected') el.querySelector('.btn.reject').classList.add('on');
  }
  refresh();
};

window.bulk = function(val){
  (DATA.lines||[]).forEach((_,i) => decisions['line:'+i] = val);
  (DATA.charges||[]).forEach((_,i) => decisions['charge:'+i] = val);
  document.querySelectorAll('.item').forEach(el => {
    const key = el.id.slice(3);
    el.classList.remove('approved','rejected'); el.classList.add(val);
    el.querySelectorAll('.btn').forEach(b => b.classList.remove('on'));
    el.querySelector('.btn.' + (val==='approved'?'approve':'reject')).classList.add('on');
  });
  refresh();
};

function totalItems(){ return (DATA.lines||[]).length + (DATA.charges||[]).length; }
function decidedCount(){ return Object.keys(decisions).length; }

function refresh(){
  const btn = document.getElementById('submitBtn');
  const hint = document.getElementById('hint');
  if (!btn) return;
  const all = decidedCount() === totalItems() && totalItems() > 0;
  btn.disabled = !all;
  if (!all){ hint.textContent = `Choose Approve or Reject for every item (${decidedCount()}/${totalItems()} done).`; return; }
  const app = Object.values(decisions).filter(v=>v==='approved').length;
  const rej = totalItems() - app;
  btn.textContent = app === 0 ? 'Submit — reject all work' : (rej === 0 ? 'Approve all & submit' : `Submit — approve ${app}, reject ${rej}`);
  hint.textContent = app === 0 ? 'You are rejecting the whole estimate.' : (rej ? 'Only the approved items will be carried out.' : 'All work approved.');
}

window.submit = async function(){
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  const app = Object.values(decisions).filter(v=>v==='approved').length;
  const rej = totalItems() - app;
  const status = app === 0 ? 'rejected' : (rej === 0 ? 'approved' : 'partial');
  try {
    await docRef.update({
      decisions,
      status,
      customer_note: (document.getElementById('note').value || '').slice(0, 500),
      responded_at: new Date().toISOString().slice(0,19).replace('T',' ')
    });
    DATA.status = status; DATA._app = app; DATA._rej = rej;
    renderDone();
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.textContent = 'Submit my decision';
    document.getElementById('hint').innerHTML = '<span style="color:var(--red)">Could not submit — please check your connection and try again.</span>';
  }
};

function renderDone(){
  const status = DATA.status || 'approved';
  const rejectedAll = status === 'rejected';
  const app = DATA._app, rej = DATA._rej;
  root.innerHTML = `
    ${brandHead()}
    <div class="done ${rejectedAll ? 'no' : 'ok'}">
      <div class="tick">${rejectedAll ? '✕' : '✓'}</div>
      <h1 style="margin-bottom:8px">${rejectedAll ? 'Estimate declined' : 'Thank you — decision received'}</h1>
      <div class="lead" style="margin:0 auto;max-width:420px">
        ${rejectedAll
          ? `We've let ${esc(DATA.workshop_name || 'the workshop')} know you'd prefer not to proceed. They'll reassemble your vehicle and be in touch about pickup.`
          : `${esc(DATA.workshop_name || 'The workshop')} has been notified and will begin the approved work. ${(typeof app==='number' && app>0 && rej>0) ? 'The declined items will be skipped.' : ''}`}
      </div>
      ${(typeof app === 'number') ? `<div style="margin-top:14px">
        ${app>0 ? `<span class="summary-pill" style="background:rgba(32,227,178,.14);color:var(--teal)">${app} approved</span>`:''}
        ${rej>0 ? `<span class="summary-pill" style="background:rgba(255,107,107,.14);color:var(--red)">${rej} declined</span>`:''}
      </div>` : ''}
      ${DATA.workshop_phone ? `<div class="sub" style="margin-top:20px">Questions? Call ${esc(DATA.workshop_phone)}</div>` : ''}
    </div>`;
}

boot();
</script>
</body>
</html>
