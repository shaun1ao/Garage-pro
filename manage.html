<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Change your booking</title>
<meta name="description" content="Book your car's service online — pick a service, choose a time, done." />
<meta name="robots" content="noindex, follow" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14; --bg2:#121722; --surf:#0e1420; --border:#26303f;
    --text:#e7ecf3; --dim:#9fb0c6; --faint:#69788f;
    --acc:#ff7a18; --acc2:#ffb347; --teal:#20e3b2; --red:#ff6b6b;
    --fd:'Sora',sans-serif; --fb:'Inter',sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f6f4ef;--bg2:#efece4;--surf:#ffffff;--border:#e2ddd2;--text:#16130e;--dim:#5b564b;--faint:#8b8576;--teal:#0c8f6c;--red:#d63b3b}
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);-webkit-font-smoothing:antialiased}
  a{color:var(--acc2)}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font:700 15px var(--fd)}
  .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center}
  .top small{color:var(--faint);font-size:12px}
  .wrap{max-width:640px;margin:0 auto;padding:26px 18px 70px}
  h1{font:800 clamp(24px,5vw,32px)/1.15 var(--fd);margin:0 0 6px}
  .sub{color:var(--dim);font-size:14.5px;line-height:1.6;margin:0 0 6px}
  .meta{color:var(--faint);font-size:13px;margin-bottom:22px;display:flex;gap:14px;flex-wrap:wrap}
  .step{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
  .step h2{font:700 15px var(--fd);margin:0 0 12px;display:flex;align-items:center;gap:10px}
  .num{width:24px;height:24px;border-radius:50%;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);display:grid;place-items:center;font-size:12px}
  .step.done .num{background:var(--teal);color:#06150f}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--border);background:var(--bg2);color:var(--text);padding:10px 14px;border-radius:10px;font:600 13.5px var(--fb);cursor:pointer}
  .chip:hover{border-color:var(--acc)}
  .chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc,#170f05);border-color:transparent}
  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
  .day{flex:none;scroll-snap-align:start;min-width:64px;text-align:center;border:1px solid var(--border);background:var(--bg2);border-radius:12px;padding:9px 6px;cursor:pointer;color:var(--text)}
  .day b{display:block;font:800 18px var(--fd)}
  .day span{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
  .day.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc,#170f05);border-color:transparent}
  .day.on span{color:inherit;opacity:.75}
  .day.off{opacity:.35;cursor:not-allowed}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .slot{border:1px solid var(--border);background:var(--bg2);border-radius:10px;padding:10px 4px;text-align:center;font:600 13.5px var(--fb);cursor:pointer;color:var(--text)}
  .slot:hover{border-color:var(--acc)}
  .slot.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc,#170f05);border-color:transparent}
  .slot.full{opacity:.35;text-decoration:line-through;cursor:not-allowed}
  .slot small{display:block;font-size:10px;font-weight:600;color:var(--faint);margin-top:2px}
  .slot.few small{color:var(--acc2)}
  label{display:block;font-size:12.5px;color:var(--dim);margin:12px 0 5px;font-weight:600}
  input,textarea,select{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font:500 15px var(--fb);outline:none}
  input:focus,textarea:focus{border-color:var(--acc)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:480px){.grid2{grid-template-columns:1fr}}
  .btn{width:100%;margin-top:18px;border:0;border-radius:12px;padding:14px;font:800 15px var(--fd);cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc,#170f05)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
  .empty{color:var(--faint);font-size:13.5px;padding:6px 0}
  .ok{text-align:center;padding:34px 22px}
  .tick{width:64px;height:64px;border-radius:50%;background:rgba(32,227,178,.15);color:var(--teal);display:grid;place-items:center;margin:0 auto 16px}
  .sum{margin:18px auto 0;max-width:380px;text-align:left;background:var(--bg2);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.9}
  .sum b{color:var(--text)} .sum span{color:var(--dim)}
  .found{background:rgba(32,227,178,.1);border:1px solid rgba(32,227,178,.35);border-radius:10px;padding:9px 12px;font-size:13px;margin:10px 0 2px;color:var(--text)}
  .oth{margin-top:8px}
  select{appearance:auto}
  .hp{position:absolute;left:-9999px;opacity:0}
  footer{padding:22px;text-align:center;color:var(--faint);font-size:12.5px}
  body.embed .top{display:none}
  body.embed footer{padding:10px;font-size:11.5px}
  body.embed .wrap{padding:14px 12px 24px;max-width:none}
  body.embed h1{font-size:22px}
  .skeleton{height:90px;border-radius:14px;background:linear-gradient(90deg,var(--bg2),var(--surf),var(--bg2));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
</style>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="top"><a class="brand" href="/"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.4 2.4-2.1-.6-.6-2.1z"/></svg></span><span class="bname">Garage Pro</span></a><small id="poweredby">Your booking</small></div>
<div class="wrap" id="app"><div class="skeleton"></div></div>
<footer>Powered by <a href="/">Garage Pro</a></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({ apiKey: "AIzaSyA1PzbhboU9Qdlpqs5cbLR3hsvFpWXCI54", authDomain: "garagepro26.firebaseapp.com", projectId: "garagepro26", storageBucket: "garagepro26.firebasestorage.app", messagingSenderId: "605094681607", appId: "1:605094681607:web:095fbfb8ff0446faaedea2" });
const db = firebase.firestore();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let W = null, R = null, holds = {}, sel = { date: '', time: '' };
const DAYS = ['sun','mon','tue','wed','thu','fri','sat'];
const DAY_LBL = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DEFAULT_HOURS = { mon:{open:true,from:'09:00',to:'18:00'}, tue:{open:true,from:'09:00',to:'18:00'}, wed:{open:true,from:'09:00',to:'18:00'},
  thu:{open:true,from:'09:00',to:'18:00'}, fri:{open:true,from:'09:00',to:'18:00'}, sat:{open:true,from:'09:00',to:'18:00'}, sun:{open:false,from:'09:00',to:'13:00'} };

// ───── time helpers (all calculated in the WORKSHOP's timezone) ─────
function tzParts(tz, d) {
  const f = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23' });
  const o = {}; f.formatToParts(d || new Date()).forEach(p => { o[p.type] = p.value; });
  return { date: `${o.year}-${o.month}-${o.day}`, min: (+o.hour) * 60 + (+o.minute) };
}
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return h * 60 + (m || 0); };
const toHHMM = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const addDays = (ds, n) => { const d = new Date(ds + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dow = ds => new Date(ds + 'T00:00:00Z').getUTCDay();
const fmt12 = hhmm => { const m = toMin(hhmm), h = Math.floor(m / 60); return `${((h + 11) % 12) + 1}:${String(m % 60).padStart(2,'0')} ${h < 12 ? 'AM' : 'PM'}`; };
const prettyDate = ds => new Date(ds + 'T00:00:00Z').toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', timeZone:'UTC' });

function slotsFor(date) {
  const hrs = (W.hours || DEFAULT_HOURS)[DAYS[dow(date)]] || { open: false };
  if (!hrs.open) return [];
  const step = Math.max(10, +W.slotMins || 30), cap = Math.max(1, +W.capacity || 1);
  const now = tzParts(W.tz || 'Asia/Kolkata');
  const earliest = now.date === date ? now.min + (+W.minNoticeH >= 0 ? +W.minNoticeH : 2) * 60 : -1;
  const blocks = (W.blocks || []).filter(b => b.date === date);
  if (blocks.some(b => b.allDay)) return [];
  const out = [];
  for (let t = toMin(hrs.from); t + step <= toMin(hrs.to); t += step) {
    const end = t + step;
    if ((W.breaks || []).some(b => t < toMin(b.to) && end > toMin(b.from))) continue;       // lunch etc.
    if (blocks.some(b => t < toMin(b.to) && end > toMin(b.from))) continue;                   // specific blocked window
    if (earliest >= 0 && t < earliest) continue;                                              // too soon
    const key = `${date}|${toHHMM(t)}`, taken = ((W.busy || {})[key] || 0) + (holds[key] || 0);
    out.push({ time: toHHMM(t), left: Math.max(0, cap - taken) });
  }
  return out;
}
function openDays() {
  const tz = W.tz || 'Asia/Kolkata', today = tzParts(tz).date, out = [];
  for (let i = 0; i <= Math.min(90, +W.maxDays || 30); i++) {
    const d = addDays(today, i);
    out.push({ date: d, ok: slotsFor(d).some(s => s.left > 0) });
  }
  return out;
}

async function loadHolds() {
  holds = {};
  try {
    const today = tzParts(W.tz || 'Asia/Kolkata').date;
    const snap = await db.collection('users').doc(W.uid).collection('slot_holds').where('date', '>=', today).get();
    snap.forEach(d => { const h = d.data(), k = `${h.date}|${h.time}`; holds[k] = (holds[k] || 0) + 1; });
  } catch (e) { /* holds are best-effort */ }
}


function applyBrand(b, name) {
  b = b || {};
  const root = document.documentElement.style;
  if (/^#[0-9a-fA-F]{6}$/.test(b.color || '')) {
    const n = parseInt(b.color.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, bl = n & 255, mix = x => Math.round(x + (255 - x) * 0.28);
    root.setProperty('--acc', b.color); root.setProperty('--acc2', `rgb(${mix(r)},${mix(g)},${mix(bl)})`);
    root.setProperty('--onacc', (0.299 * r + 0.587 * g + 0.114 * bl) / 255 > 0.62 ? '#16130e' : '#ffffff');
  }
  const brand = document.querySelector('.brand'); if (!brand) return;
  const logoEl = brand.querySelector('.logo'), nm = brand.querySelector('.bname');
  if (name && nm) nm.textContent = name;
  if (logoEl) {
    if (/^(data:image\/(png|jpeg|webp);base64,|https:\/\/)/.test(b.logo || '')) {
      logoEl.style.cssText = 'background:#fff;padding:3px 6px;width:auto;min-width:32px;height:34px';
      logoEl.innerHTML = '<img alt="" style="height:26px;max-width:120px;object-fit:contain;display:block">'; logoEl.firstChild.src = b.logo;
    } else if (name) {
      logoEl.innerHTML = '<span style="font:800 16px var(--fd);color:var(--onacc,#170f05)"></span>'; logoEl.firstChild.textContent = name.trim().charAt(0).toUpperCase();
    }
  }
  const pb = document.getElementById('poweredby');
  if (pb) pb.innerHTML = 'Powered by <a href="/" style="color:inherit;font-weight:700;text-decoration:none">Garage Pro</a>';
}

// ───── this page: change or cancel ONE booking, from the link in the confirmation email ─────
const QS = new URLSearchParams(location.search), parts = location.pathname.split('/').filter(Boolean);
const SLUG = (QS.get('w') || (parts[0] === 'manage' ? parts[1] : '') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
const RID = QS.get('r') || (parts[0] === 'manage' ? parts[2] : '') || '';
const pretty = (d, t) => `${new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' })}, ${fmt12(t)}`;
function hoursUntil() { const tz = W.tz || 'Asia/Kolkata', now = tzParts(tz), days = (Date.parse(R.date + 'T00:00:00Z') - Date.parse(now.date + 'T00:00:00Z')) / 864e5; return days * 24 + (toMin(R.time) - now.min) / 60; }
function reqRef() { return db.collection('users').doc(W.uid).collection('booking_requests').doc(RID); }
function holdRef() { return db.collection('users').doc(W.uid).collection('slot_holds').doc(RID); }

(async function init() {
  if (!/^[a-z0-9-]{3,48}$/.test(SLUG) || !/^[A-Za-z0-9]{12,40}$/.test(RID)) return location.replace('/403.html?why=link');
  try {
    const ws = await db.collection('public_booking').doc(SLUG).get();
    if (!ws.exists) return location.replace('/403.html?why=link');
    W = ws.data(); applyBrand(W.brand, W.name);
    const rs = await db.collection('users').doc(W.uid).collection('booking_requests').doc(RID).get();
    if (!rs.exists) return location.replace('/403.html?why=link');
    R = rs.data(); await loadHolds(); view();
  } catch (e) { $('app').innerHTML = `<p class="sub">Couldn't load this booking. ${esc(e.message || e)}</p>`; }
})();

function summary() {
  return `<div class="sum"><span>Service</span> <b>${esc(R.service || 'Service')}</b><br><span>When</span> <b>${esc(pretty(R.date, R.time))}</b><br><span>Vehicle</span> <b>${esc(R.plate || '')}</b><br><span>Name</span> <b>${esc(R.name || '')}</b></div>`;
}
function view(msg) {
  document.title = 'Your booking · ' + (W.name || 'Garage');
  const cancelled = R.status === 'cancelled' || R.status === 'declined', open = ['pending', 'accepted'].includes(R.status);
  const cutoff = Number(W.cutoff_h) >= 0 ? Number(W.cutoff_h) : 24, hrs = hoursUntil(), tooLate = hrs < cutoff, used = Number(R.reschedules || 0) >= 1;
  const phone = W.phone ? `<a href="tel:${esc(W.phone)}">${esc(W.phone)}</a>` : 'the workshop';
  let body;
  if (cancelled) body = `<h1>Booking ${R.status === 'declined' ? 'declined' : 'cancelled'}</h1><p class="sub">${R.status === 'declined' ? 'The workshop could not take this booking.' : 'This booking has been cancelled.'} You can book again whenever you like.</p>${summary()}<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:18px" href="/book/${esc(SLUG)}">Book another time</a>`;
  else if (!W.self_service) body = `<h1>Your booking</h1>${summary()}<p class="sub" style="margin-top:14px">To change or cancel this booking, please call ${phone}.</p>`;
  else if (R.status === 'completed' || !open) body = `<h1>Your booking</h1>${summary()}<p class="sub" style="margin-top:14px">This booking can no longer be changed online. Please call ${phone}.</p>`;
  else body = `<h1>Your booking</h1>${msg ? `<p class="found" style="display:block">${esc(msg)}</p>` : ''}<p class="sub">${R.status === 'pending' ? 'Waiting for the workshop to confirm.' : 'Confirmed by the workshop.'}</p>${summary()}
    ${tooLate ? `<p class="sub" style="margin-top:14px">Changes online close ${cutoff} hour${cutoff === 1 ? '' : 's'} before the slot. To change or cancel now, please call ${phone}.</p>` : `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">
      ${used ? '' : `<button class="btn" id="mvBtn" type="button" style="width:auto;padding:12px 22px;margin:0">Choose another time</button>`}
      <button class="btn-ghost" id="cxBtn" type="button" style="font:600 14px var(--fb);padding:12px 18px;border-radius:3px;cursor:pointer">Cancel this booking</button>
    </div>
    ${used ? `<p class="sub" style="margin-top:12px;font-size:13px">You have already moved this booking once. To change it again, please call ${phone}.</p>` : ''}
    <div id="panel"></div>`}`;
  $('app').innerHTML = body;
  const mv = $('mvBtn'), cx = $('cxBtn');
  if (mv) mv.onclick = pick;
  if (cx) cx.onclick = () => { $('panel').innerHTML = `<div class="step" style="margin-top:18px"><h2>Cancel this booking?</h2><p class="sub">The slot is released straight away.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="cxYes" type="button" style="width:auto;padding:12px 22px;margin:0">Yes, cancel it</button><button class="btn-ghost" id="cxNo" type="button" style="font:600 14px var(--fb);padding:12px 18px;border-radius:3px;cursor:pointer">Keep it</button></div><div class="err" id="err"></div></div>`; $('cxNo').onclick = () => { $('panel').innerHTML = ''; }; $('cxYes').onclick = cancel; };
}
function pick() {
  if (!sel.date) { const f = openDays().find(d => d.ok); if (f) sel.date = f.date; }
  const days = openDays(), slots = sel.date ? slotsFor(sel.date) : [];
  $('panel').innerHTML = `<div class="step" style="margin-top:18px"><h2>Pick a new day and time</h2>
    <div class="days" id="days">${days.map(d => `<button type="button" class="day ${d.date === sel.date ? 'on' : ''} ${d.ok ? '' : 'off'}" data-d="${d.date}" ${d.ok ? '' : 'disabled'}><span>${DAY_LBL[dow(d.date)]}</span><b>${+d.date.slice(8)}</b><span>${new Date(d.date + 'T00:00:00Z').toLocaleDateString('en-GB', { month: 'short', timeZone: 'UTC' })}</span></button>`).join('')}</div>
    <div style="height:12px"></div>
    ${slots.length ? `<div class="slots">${slots.map(s => `<button type="button" class="slot ${s.left ? '' : 'full'} ${sel.time === s.time ? 'on' : ''}" data-t="${s.time}" ${s.left ? '' : 'disabled'}>${fmt12(s.time)}</button>`).join('')}</div>` : '<div class="empty">No open slots that day.</div>'}
    <div class="err" id="err"></div>
    <button class="btn" id="saveMv" type="button" style="width:auto;padding:12px 22px" ${sel.time ? '' : 'disabled'}>Move my booking</button></div>`;
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { sel.date = b.dataset.d; sel.time = ''; pick(); });
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { sel.time = b.dataset.t; pick(); });
  const sv = $('saveMv'); if (sv) sv.onclick = move;
}
async function cancel() {
  const b = $('cxYes'); b.disabled = true;
  try {
    const batch = db.batch();
    batch.update(reqRef(), { status: 'cancelled', date: R.date, time: R.time, changed_at: new Date().toISOString(), change_pending: true, change_kind: 'cancel', change_note: 'Cancelled by the customer' });
    batch.delete(holdRef());
    await batch.commit(); R.status = 'cancelled'; view();
  } catch (e) { b.disabled = false; $('err').textContent = 'Could not cancel just now — please call the workshop.'; }
}
async function move() {
  const b = $('saveMv'); b.disabled = true; $('err').textContent = '';
  try {
    await loadHolds();
    const fresh = slotsFor(sel.date).find(s => s.time === sel.time);
    if (!fresh || !fresh.left) { sel.time = ''; pick(); $('err').textContent = 'Sorry, that slot was just taken. Please pick another.'; return; }
    const batch = db.batch();
    batch.update(reqRef(), { date: sel.date, time: sel.time, status: R.status, reschedules: Number(R.reschedules || 0) + 1, changed_at: new Date().toISOString(), change_pending: true, change_kind: 'move', change_note: 'Moved by the customer' });
    batch.update(holdRef(), { date: sel.date, time: sel.time });
    await batch.commit(); R.date = sel.date; R.time = sel.time; R.reschedules = Number(R.reschedules || 0) + 1; view('Done. Your booking has moved.');
  } catch (e) { b.disabled = false; $('err').textContent = 'Could not move it just now — please call the workshop.'; }
}
</script>
<script src="i18n/gp-lang.js"></script>
<script src="gp-busy.js"></script>
</body>
</html>
