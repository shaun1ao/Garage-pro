<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Book a service · Garage Pro</title>
<meta name="description" content="Book your car's service online — pick a service, choose a time, done." />
<meta name="robots" content="noindex, follow" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14; --bg2:#121722; --surf:#0e1420; --border:#26303f;
    --text:#e7ecf3; --dim:#9fb0c6; --faint:#69788f;
    --acc:#ff7a18; --acc2:#ffb347; --teal:#20e3b2; --red:#ff6b6b;
    --fd:'Sora',sans-serif; --fb:'Inter',sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f6f4ef;--bg2:#efece4;--surf:#ffffff;--border:#e2ddd2;--text:#16130e;--dim:#5b564b;--faint:#8b8576;--teal:#0c8f6c;--red:#d63b3b}
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);-webkit-font-smoothing:antialiased}
  a{color:var(--acc2)}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font:700 15px var(--fd)}
  .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center}
  .top small{color:var(--faint);font-size:12px}
  .wrap{max-width:640px;margin:0 auto;padding:26px 18px 70px}
  h1{font:800 clamp(24px,5vw,32px)/1.15 var(--fd);margin:0 0 6px}
  .sub{color:var(--dim);font-size:14.5px;line-height:1.6;margin:0 0 6px}
  .meta{color:var(--faint);font-size:13px;margin-bottom:22px;display:flex;gap:14px;flex-wrap:wrap}
  .step{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
  .step h2{font:700 15px var(--fd);margin:0 0 12px;display:flex;align-items:center;gap:10px}
  .num{width:24px;height:24px;border-radius:50%;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);display:grid;place-items:center;font-size:12px}
  .step.done .num{background:var(--teal);color:#06150f}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--border);background:var(--bg2);color:var(--text);padding:10px 14px;border-radius:10px;font:600 13.5px var(--fb);cursor:pointer}
  .chip:hover{border-color:var(--acc)}
  .chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc,#170f05);border-color:transparent}
  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
  .day{flex:none;scroll-snap-align:start;min-width:64px;text-align:center;border:1px solid var(--border);background:var(--bg2);border-radius:12px;padding:9px 6px;cursor:pointer;color:var(--text)}
  .day b{display:block;font:800 18px var(--fd)}
  .day span{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
  .day.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc,#170f05);border-color:transparent}
  .day.on span{color:inherit;opacity:.75}
  .day.off{opacity:.35;cursor:not-allowed}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .slot{border:1px solid var(--border);background:var(--bg2);border-radius:10px;padding:10px 4px;text-align:center;font:600 13.5px var(--fb);cursor:pointer;color:var(--text)}
  .slot:hover{border-color:var(--acc)}
  .slot.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc,#170f05);border-color:transparent}
  .slot.full{opacity:.35;text-decoration:line-through;cursor:not-allowed}
  .slot small{display:block;font-size:10px;font-weight:600;color:var(--faint);margin-top:2px}
  .slot.few small{color:var(--acc2)}
  label{display:block;font-size:12.5px;color:var(--dim);margin:12px 0 5px;font-weight:600}
  input,textarea,select{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font:500 15px var(--fb);outline:none}
  input:focus,textarea:focus{border-color:var(--acc)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:480px){.grid2{grid-template-columns:1fr}}
  .btn{width:100%;margin-top:18px;border:0;border-radius:12px;padding:14px;font:800 15px var(--fd);cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc,#170f05)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
  .empty{color:var(--faint);font-size:13.5px;padding:6px 0}
  .ok{text-align:center;padding:34px 22px}
  .tick{width:64px;height:64px;border-radius:50%;background:rgba(32,227,178,.15);color:var(--teal);display:grid;place-items:center;margin:0 auto 16px}
  .sum{margin:18px auto 0;max-width:380px;text-align:left;background:var(--bg2);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.9}
  .sum b{color:var(--text)} .sum span{color:var(--dim)}
  .found{background:rgba(32,227,178,.1);border:1px solid rgba(32,227,178,.35);border-radius:10px;padding:9px 12px;font-size:13px;margin:10px 0 2px;color:var(--text)}
  .oth{margin-top:8px}
  select{appearance:auto}
  .hp{position:absolute;left:-9999px;opacity:0}
  footer{padding:22px;text-align:center;color:var(--faint);font-size:12.5px}
  body.embed .top{display:none}
  body.embed footer{padding:10px;font-size:11.5px}
  body.embed .wrap{padding:14px 12px 24px;max-width:none}
  body.embed h1{font-size:22px}
  .skeleton{height:90px;border-radius:14px;background:linear-gradient(90deg,var(--bg2),var(--surf),var(--bg2));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="/"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#170f05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.3 2.3-2-2 2.3-2.3z"/></svg></span><span class="bname">Garage Pro</span></a>
  <small id="poweredby">Online booking</small>
</div>

<div class="wrap" id="app"><div class="skeleton"></div></div>
<footer>Booking powered by <a href="/">Garage Pro</a></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyA1PzbhboU9Qdlpqs5cbLR3hsvFpWXCI54",
  authDomain: "garagepro26.firebaseapp.com",
  projectId: "garagepro26",
  storageBucket: "garagepro26.firebasestorage.app",
  messagingSenderId: "605094681607",
  appId: "1:605094681607:web:095fbfb8ff0446faaedea2"
});
const db = firebase.firestore();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS = ['sun','mon','tue','wed','thu','fri','sat'];
const DAY_LBL = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DEFAULT_HOURS = { mon:{open:true,from:'09:00',to:'18:00'}, tue:{open:true,from:'09:00',to:'18:00'}, wed:{open:true,from:'09:00',to:'18:00'},
  thu:{open:true,from:'09:00',to:'18:00'}, fri:{open:true,from:'09:00',to:'18:00'}, sat:{open:true,from:'09:00',to:'18:00'}, sun:{open:false,from:'09:00',to:'13:00'} };

const QS = new URLSearchParams(location.search), EMBED = QS.get('embed') === '1';
if (EMBED) document.body.classList.add('embed');
if (QS.get('theme') === 'light') document.documentElement.style.cssText += ';--bg:#ffffff;--bg2:#f3f1ec;--surf:#ffffff;--border:#e2ddd2;--text:#16130e;--dim:#5b564b;--faint:#8b8576;--teal:#0c8f6c;--red:#d63b3b';
if (QS.get('theme') === 'dark') document.documentElement.style.cssText += ';--bg:#0a0e14;--bg2:#121722;--surf:#0e1420;--border:#26303f;--text:#e7ecf3;--dim:#9fb0c6;--faint:#69788f';
if (/^#?[0-9a-fA-F]{6}$/.test(QS.get('accent') || '')) { const a = '#' + QS.get('accent').replace('#', ''); document.documentElement.style.setProperty('--acc', a); document.documentElement.style.setProperty('--acc2', a); }
if (EMBED && QS.get('theme')) document.body.style.background = 'transparent';
function postHeight() { try { if (window.parent !== window) parent.postMessage({ type: 'gp-book-height', height: document.documentElement.scrollHeight }, '*'); } catch (e) {} }
new ResizeObserver(postHeight).observe(document.documentElement);
let W = null, SLUG = '', holds = {}, sel = { service: '', date: '', time: '' }, loadedAt = Date.now();

// ───── time helpers (all calculated in the WORKSHOP's timezone) ─────
function tzParts(tz, d) {
  const f = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23' });
  const o = {}; f.formatToParts(d || new Date()).forEach(p => { o[p.type] = p.value; });
  return { date: `${o.year}-${o.month}-${o.day}`, min: (+o.hour) * 60 + (+o.minute) };
}
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return h * 60 + (m || 0); };
const toHHMM = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const addDays = (ds, n) => { const d = new Date(ds + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dow = ds => new Date(ds + 'T00:00:00Z').getUTCDay();
const fmt12 = hhmm => { const m = toMin(hhmm), h = Math.floor(m / 60); return `${((h + 11) % 12) + 1}:${String(m % 60).padStart(2,'0')} ${h < 12 ? 'AM' : 'PM'}`; };
const prettyDate = ds => new Date(ds + 'T00:00:00Z').toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', timeZone:'UTC' });

function slotsFor(date) {
  const hrs = (W.hours || DEFAULT_HOURS)[DAYS[dow(date)]] || { open: false };
  if (!hrs.open) return [];
  const step = Math.max(10, +W.slotMins || 30), cap = Math.max(1, +W.capacity || 1);
  const now = tzParts(W.tz || 'Asia/Kolkata');
  const earliest = now.date === date ? now.min + (+W.minNoticeH >= 0 ? +W.minNoticeH : 2) * 60 : -1;
  const blocks = (W.blocks || []).filter(b => b.date === date);
  if (blocks.some(b => b.allDay)) return [];
  const out = [];
  for (let t = toMin(hrs.from); t + step <= toMin(hrs.to); t += step) {
    const end = t + step;
    if ((W.breaks || []).some(b => t < toMin(b.to) && end > toMin(b.from))) continue;       // lunch etc.
    if (blocks.some(b => t < toMin(b.to) && end > toMin(b.from))) continue;                   // specific blocked window
    if (earliest >= 0 && t < earliest) continue;                                              // too soon
    const key = `${date}|${toHHMM(t)}`, taken = ((W.busy || {})[key] || 0) + (holds[key] || 0);
    out.push({ time: toHHMM(t), left: Math.max(0, cap - taken) });
  }
  return out;
}
function openDays() {
  const tz = W.tz || 'Asia/Kolkata', today = tzParts(tz).date, out = [];
  for (let i = 0; i <= Math.min(90, +W.maxDays || 30); i++) {
    const d = addDays(today, i);
    out.push({ date: d, ok: slotsFor(d).some(s => s.left > 0) });
  }
  return out;
}

// ───── load ─────
(async function init() {
  const q = new URLSearchParams(location.search);
  SLUG = (q.get('w') || location.pathname.split('/').filter(Boolean).pop() || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
  if (!SLUG || SLUG === 'book' || SLUG === 'book.html') return deny('link');
  try {
    let snap = await db.collection('public_booking').doc(SLUG).get();
    // A workshop can rename its link — the old one keeps working by pointing at the new one.
    for (let hop = 0; hop < 3 && snap.exists && snap.data().redirect; hop++) { SLUG = snap.data().redirect; snap = await db.collection('public_booking').doc(SLUG).get(); }
    if (!snap.exists) return deny('link');
    W = snap.data();
    if (!W.enabled) return deny('booking');
    applyBrand(W.brand, W.name);
    await loadHolds();
    document.title = `Book a service · ${W.name || 'Garage'}`;
    render();
  } catch (e) {
    $('app').innerHTML = `<div class="step"><h2>Couldn't load this page</h2><div class="empty">${esc(e.message || e)}. Please refresh, or call the workshop directly.</div></div>`;
  }
})();

// Workshop branding: logo + name + colour scheme, with "Powered by Garage Pro" kept visible.
function applyBrand(b, name) {
  b = b || {};
  const root = document.documentElement.style;
  if (/^#[0-9a-fA-F]{6}$/.test(b.color || '')) {
    const n = parseInt(b.color.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, bl = n & 255, mix = x => Math.round(x + (255 - x) * 0.28);
    root.setProperty('--acc', b.color); root.setProperty('--acc2', `rgb(${mix(r)},${mix(g)},${mix(bl)})`);
    root.setProperty('--onacc', (0.299 * r + 0.587 * g + 0.114 * bl) / 255 > 0.62 ? '#16130e' : '#ffffff');
  }
  const brand = document.querySelector('.brand'); if (!brand) return;
  const logoEl = brand.querySelector('.logo'), nm = brand.querySelector('.bname');
  if (name && nm) nm.textContent = name;
  if (logoEl) {
    if (/^(data:image\/(png|jpeg|webp);base64,|https:\/\/)/.test(b.logo || '')) {
      logoEl.style.cssText = 'background:#fff;padding:3px 6px;width:auto;min-width:32px;height:34px';
      logoEl.innerHTML = '<img alt="" style="height:26px;max-width:120px;object-fit:contain;display:block">'; logoEl.firstChild.src = b.logo;
    } else if (name) {
      logoEl.innerHTML = '<span style="font:800 16px var(--fd);color:var(--onacc,#170f05)"></span>'; logoEl.firstChild.textContent = name.trim().charAt(0).toUpperCase();
    }
  }
  const pb = document.getElementById('poweredby');
  if (pb) pb.innerHTML = 'Powered by <a href="/" style="color:inherit;font-weight:700;text-decoration:none">Garage Pro</a>';
}

function deny(why) {
  if (EMBED) {          // inside someone's website: show a message instead of navigating the frame away
    $('app').innerHTML = `<div class="step"><h2>${why === 'booking' ? 'Online booking is switched off right now' : 'This booking link isn\'t valid'}</h2><div class="empty">Please contact the workshop directly to book.</div></div>`;
    return;
  }
  location.replace('/403.html?why=' + why);
}
async function loadHolds() {
  holds = {};
  try {
    const today = tzParts(W.tz || 'Asia/Kolkata').date;
    const snap = await db.collection('users').doc(W.uid).collection('slot_holds').where('date', '>=', today).get();
    snap.forEach(d => { const h = d.data(), k = `${h.date}|${h.time}`; holds[k] = (holds[k] || 0) + 1; });
  } catch (e) { /* holds are best-effort */ }
}


// ───── vehicle pickers — use the SAME make / model database as the workshop's app ─────
const COLOURS = ['White', 'Silver', 'Grey', 'Black', 'Red', 'Blue', 'Brown', 'Beige', 'Green', 'Yellow', 'Orange', 'Maroon', 'Gold', 'Purple'];
const FUELS = ['Petrol', 'Diesel', 'CNG', 'LPG', 'Electric', 'Hybrid'];
const OTHER = '__other';
let F = {};   // (fLang defaults to the language chosen in the 🌐 picker — set below)                                   // everything the customer has typed / picked (survives re-renders)
try { F = JSON.parse(localStorage.getItem('gp_book_me') || '{}') || {}; } catch (e) { F = {}; }
if (window.GP && GP.code() !== 'en') F.fLang = GP.code();      // someone browsing in Tamil gets Tamil messages unless they change it
const VDB = () => (W && W.vehicles) || {};
function makeOpts() { return Object.keys(VDB()).sort(); }
function modelOpts() { const m = F.vMake && F.vMake !== OTHER ? VDB()[F.vMake] : null; return m ? Object.keys(m).sort() : []; }
function yearOpts() {
  const m = F.vMake && F.vModel && F.vMake !== OTHER && F.vModel !== OTHER ? (VDB()[F.vMake] || {})[F.vModel] : null;
  const from = m && m.from ? +m.from : new Date().getFullYear() - 40, out = [];
  for (let y = new Date().getFullYear() + 1; y >= from; y--) out.push(String(y));
  return out;
}
function sel2(id, opts, noOther) {
  const cur = F[id] || '';
  return `<select id="${id}"><option value="">Select…</option>${opts.map(o => `<option value="${esc(o)}" ${cur === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}${noOther ? '' : `<option value="${OTHER}" ${cur === OTHER ? 'selected' : ''}>Other…</option>`}</select>`;
}
const vval = id => { const v = F[id]; return v === OTHER ? (F[id + 'O'] || '').trim() : (v || '').trim(); };
function syncVehicleUI() {                    // show the "type it" box for Other, rebuild model/year lists
  const mk = $('vModel'), yr = $('vYear');
  if (mk) { const keep = F.vModel; mk.outerHTML = sel2('vModel', modelOpts()); $('vModel').onchange = onVeh; $('vModel').value = keep || ''; }
  if (yr) { const keep = F.vYear; yr.outerHTML = sel2('vYear', yearOpts()); $('vYear').onchange = onVeh; $('vYear').value = keep || ''; }
  ['vMake', 'vModel', 'vYear', 'vColour'].forEach(id => { const o = $(id + 'O'); if (o) { o.style.display = F[id] === OTHER ? 'block' : 'none'; o.value = F[id + 'O'] || ''; } });
  // a make that isn't in the list means the model has to be typed too
  if (F.vMake === OTHER && F.vModel !== OTHER) { F.vModel = OTHER; $('vModel').value = OTHER; if ($('vModelO')) $('vModelO').style.display = 'block'; }
}
function onVeh(e) {
  const id = e.target.id; F[id] = e.target.value;
  if (id === 'vMake') { F.vModel = ''; F.vYear = ''; }
  if (id === 'vModel') { F.vYear = ''; }
  syncVehicleUI();
}
// Fill from the shared vehicle registry (the app saves every serviced car here by plate), then
// ask only for what's still missing. Only vehicle details are used — never the owner's personal info.
let lookupT = null;
function lookupPlateSoon() { clearTimeout(lookupT); lookupT = setTimeout(lookupPlate, 600); }
async function lookupPlate() {
  const pn = (F.fPlate || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const box = $('vFound'); if (!box || pn.length < 6 || pn === lookupPlate.last) return; lookupPlate.last = pn;
  try {
    const snap = await db.collection('vehicle_registry').doc(pn).get();
    if (!snap.exists) { box.style.display = 'none'; return; }
    const r = snap.data(), got = [];
    const setPick = (id, val, list) => { if (!val || F[id]) return; if (list && list.includes(val)) F[id] = val; else if (list && !list.some(x => x.toLowerCase() === String(val).toLowerCase())) { F[id] = OTHER; F[id + 'O'] = val; } else F[id] = (list || []).find(x => x.toLowerCase() === String(val).toLowerCase()) || val; got.push(id); };
    setPick('vMake', r.make, makeOpts()); syncVehicleUI();
    setPick('vModel', r.model, modelOpts()); syncVehicleUI();
    setPick('vYear', String(r.year || ''), yearOpts());
    setPick('vColour', r.color || r.colour, COLOURS);
    if (r.fuel_type && !F.vFuel && FUELS.includes(r.fuel_type)) { F.vFuel = r.fuel_type; got.push('vFuel'); }
    if (r.vin && !F.vVin) { F.vVin = String(r.vin).toUpperCase().slice(0, 17); got.push('vVin'); }
    syncVehicleUI(); applyF();
    const missing = [['vMake', 'make'], ['vModel', 'model'], ['vYear', 'year'], ['vColour', 'colour'], ['vFuel', 'fuel']].filter(([id]) => !vval(id)).map(x => x[1]);
    box.style.display = 'block';
    box.innerHTML = got.length ? `✓ We found your car and filled in what we know. Please check it${missing.length ? ` — we still need your <b>${missing.join(', ')}</b>` : ''}.` : '';
    if (!got.length) box.style.display = 'none';
  } catch (e) { /* registry is a convenience only */ }
}
function applyF() { document.querySelectorAll('#app input[id],#app select[id],#app textarea[id]').forEach(el => { if (el.id !== 'fHp' && F[el.id] !== undefined) el.value = F[el.id]; }); }

// ───── render ─────
function render() {
  const services = (W.services || []).map(s => typeof s === 'string' ? s : s.name).filter(Boolean);
  const days = openDays();
  if (!sel.date) { const f = days.find(d => d.ok); if (f) sel.date = f.date; }
  const slots = sel.date ? slotsFor(sel.date) : [];
  const canPick = days.some(d => d.ok);
  $('app').innerHTML = `
    <h1>${esc(W.name || 'Book a service')}</h1>
    ${W.welcome ? `<p class="sub">${esc(W.welcome)}</p>` : `<p class="sub">Pick a service and a time that suits you — it takes a minute.</p>`}
    <div class="meta">${W.city ? `<span>📍 ${esc([W.address, W.city].filter(Boolean).join(', ').slice(0, 90))}</span>` : ''}${W.phone ? `<a href="tel:${esc(W.phone)}" style="color:var(--dim);text-decoration:none">📞 ${esc(W.phone)}</a>` : ''}</div>

    <div class="step ${sel.service ? 'done' : ''}"><h2><span class="num">1</span>What do you need?</h2>
      ${services.length ? `<div class="chips">${services.map(s => `<button type="button" class="chip ${sel.service === s ? 'on' : ''}" data-svc="${esc(s)}">${esc(s)}</button>`).join('')}</div>`
        : `<input id="svcFree" placeholder="e.g. Full service, brake check, AC repair" value="${esc(sel.service)}" />`}
    </div>

    <div class="step ${sel.time ? 'done' : ''}"><h2><span class="num">2</span>Pick a day &amp; time</h2>
      ${canPick ? `<div class="days" id="days">${days.map(d => `<button type="button" class="day ${d.date === sel.date ? 'on' : ''} ${d.ok ? '' : 'off'}" data-d="${d.date}" ${d.ok ? '' : 'disabled'}><span>${DAY_LBL[dow(d.date)]}</span><b>${+d.date.slice(8)}</b><span>${new Date(d.date + 'T00:00:00Z').toLocaleDateString('en-IN', { month: 'short', timeZone: 'UTC' })}</span></button>`).join('')}</div>
        <div style="height:12px"></div>
        ${slots.length ? `<div class="slots">${slots.map(s => `<button type="button" class="slot ${s.left ? '' : 'full'} ${s.left && s.left <= 1 ? 'few' : ''} ${sel.time === s.time ? 'on' : ''}" data-t="${s.time}" ${s.left ? '' : 'disabled'}>${fmt12(s.time)}${s.left && s.left <= 1 ? '<small>last slot</small>' : ''}</button>`).join('')}</div>` : `<div class="empty">No times available on this day.</div>`}`
        : `<div class="empty">No online slots are open right now. Please call the workshop${W.phone ? ' on ' + esc(W.phone) : ''}.</div>`}
    </div>

    <div class="step"><h2><span class="num">3</span>Your vehicle</h2>
      <label>Vehicle number *</label><input id="fPlate" placeholder="${W.country === 'AE' ? 'A 12345' : 'MH12 AB 1234'}" autocomplete="off" style="text-transform:uppercase" />
      <div id="vFound" class="found" style="display:none"></div>
      <div class="grid2"><div><label>Make *</label>${sel2('vMake', makeOpts())}<input id="vMakeO" class="oth" placeholder="Type the make" style="display:none" /></div>
        <div><label>Model *</label>${sel2('vModel', modelOpts())}<input id="vModelO" class="oth" placeholder="Type the model" style="display:none" /></div></div>
      <div class="grid2"><div><label>Year *</label>${sel2('vYear', yearOpts())}<input id="vYearO" class="oth" placeholder="e.g. 2016" inputmode="numeric" maxlength="4" style="display:none" /></div>
        <div><label>Colour *</label>${sel2('vColour', COLOURS)}<input id="vColourO" class="oth" placeholder="Type the colour" style="display:none" /></div></div>
      <div class="grid2"><div><label>Fuel *</label>${sel2('vFuel', FUELS, true)}</div>
        <div><label>VIN / chassis no. <span style="font-weight:400;color:var(--faint)">(optional)</span></label><input id="vVin" maxlength="17" placeholder="17 characters" autocomplete="off" style="text-transform:uppercase" /></div></div>
      <div style="font-size:12px;color:var(--faint);margin-top:6px">Your VIN is printed on your RC book and at the base of the windscreen. It helps us order the right parts.</div>
    </div>

    <div class="step"><h2><span class="num">4</span>Your details</h2>
      <div class="grid2"><div><label>Your name *</label><input id="fName" autocomplete="name" /></div>
        <div><label>Mobile number *</label><input id="fPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="${W.country === 'AE' ? '50 123 4567' : '98765 43210'}" /></div></div>
      <label>Email *</label><input id="fEmail" type="email" autocomplete="email" placeholder="you@example.com" />
      <label>Language for our messages</label><select id="fLang">${(window.GP ? GP.LANGS : [['en', 'English', 'English']]).map(l => `<option value="${l[0]}">${esc(l[2])}${l[0] === 'en' ? '' : ' · ' + esc(l[1])}</option>`).join('')}</select>
      <label>Anything we should know? <span style="font-weight:400;color:var(--faint)">(optional)</span></label><textarea id="fNotes" rows="3" maxlength="500" placeholder="Noise, warning light, pickup needed…"></textarea>
      <input class="hp" id="fHp" tabindex="-1" autocomplete="off" aria-hidden="true" />
      <div class="err" id="err"></div>
      <button class="btn" id="go" type="button" ${canPick ? '' : 'disabled'}>Request this booking</button>
      <p class="sub" style="font-size:12.5px;margin-top:12px;text-align:center">You'll receive a confirmation by phone, WhatsApp or email. No payment needed now.</p>
    </div>`;
  document.querySelectorAll('[data-svc]').forEach(b => b.onclick = () => { sel.service = b.dataset.svc; keepForm(); });
  const free = $('svcFree'); if (free) free.oninput = () => { sel.service = free.value.trim(); };
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { sel.date = b.dataset.d; sel.time = ''; keepForm(); });
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { sel.time = b.dataset.t; keepForm(); });
  $('go').onclick = submit;
  const A = $('app');
  A.oninput = A.onchange = e => { const id = e.target.id; if (!id || id === 'fHp') return; F[id] = e.target.value; if (id === 'fPlate') lookupPlateSoon(); };
  ['vMake', 'vModel', 'vYear'].forEach(id => $(id) && ($(id).onchange = onVeh));
  $('vColour').onchange = e => { F.vColour = e.target.value; syncVehicleUI(); };
  applyF(); syncVehicleUI(); if (F.fPlate) lookupPlate();
}
function keepForm() { render(); }      // all typed values live in F, so a re-render keeps them

// ───── submit ─────
async function submit() {
  const err = $('err'); err.textContent = '';
  const v = id => ($(id).value || '').trim();
  const name = v('fName'), phone = v('fPhone').replace(/[^\d+]/g, ''), plate = v('fPlate').toUpperCase().replace(/\s+/g, ' '), email = v('fEmail');
  if ($('fHp').value) return;                                      // bot
  if (Date.now() - loadedAt < 2500) { err.textContent = 'One moment…'; return; }
  const services = (W.services || []).length;
  if (!sel.service && services) return err.textContent = 'Please choose what you need.';
  if (!sel.service) sel.service = ($('svcFree') || {}).value || 'General service';
  if (!sel.date || !sel.time) return err.textContent = 'Please pick a day and a time.';
  if (plate.replace(/\W/g, '').length < 4) return err.textContent = 'Please enter your vehicle number.';
  const lang = (window.GP && GP.valid(F.fLang)) ? F.fLang : 'en';
  const make = vval('vMake'), model = vval('vModel'), year = vval('vYear'), colour = vval('vColour'), fuel = vval('vFuel'), vin = (v('vVin') || '').toUpperCase().replace(/\s+/g, '');
  if (!make) return err.textContent = 'Please choose your vehicle\'s make.';
  if (!model) return err.textContent = 'Please choose your vehicle\'s model.';
  if (!/^(19|20)\d{2}$/.test(year)) return err.textContent = 'Please choose the year your car was made.';
  if (!colour) return err.textContent = 'Please choose your car\'s colour.';
  if (!fuel) return err.textContent = 'Please choose the fuel type.';
  if (vin && !/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)) return err.textContent = 'A VIN has 17 letters/numbers (no I, O or Q). Leave it blank if you don\'t have it handy.';
  if (name.length < 2) return err.textContent = 'Please enter your name.';
  if (phone.replace(/\D/g, '').length < (W.country === 'AE' ? 9 : 10)) return err.textContent = 'Please enter a valid mobile number.';
  if (!/^\S+@\S+\.\S+$/.test(email)) return err.textContent = 'Please enter a valid email address.';
  const btn = $('go'); btn.disabled = true; btn.textContent = 'Sending…';
  try {
    // make sure the slot hasn't just filled up
    await loadHolds();
    const fresh = slotsFor(sel.date).find(s => s.time === sel.time);
    if (!fresh || !fresh.left) { sel.time = ''; keepForm(); $('err').textContent = 'Sorry — that slot was just taken. Please pick another.'; return; }
    const ref = db.collection('users').doc(W.uid).collection('booking_requests').doc();
    const batch = db.batch();
    batch.set(ref, { slug: SLUG, name, phone, email, lang, plate, make: make.slice(0, 40), model: model.slice(0, 50), year, colour: colour.slice(0, 30), fuel, vin,
      vehicle: [year, make, model].filter(Boolean).join(' ').slice(0, 100), service: sel.service.slice(0, 100),
      date: sel.date, time: sel.time, notes: v('fNotes').slice(0, 500), status: 'pending', created_at: new Date().toISOString() });
    batch.set(db.collection('users').doc(W.uid).collection('slot_holds').doc(ref.id), { slug: SLUG, date: sel.date, time: sel.time, created_at: new Date().toISOString() });
    await batch.commit();
    try { const keep = {}; ['fName', 'fPhone', 'fEmail', 'fLang', 'fPlate', 'vMake', 'vMakeO', 'vModel', 'vModelO', 'vYear', 'vYearO', 'vColour', 'vColourO', 'vFuel', 'vVin'].forEach(k => { if (F[k]) keep[k] = F[k]; }); localStorage.setItem('gp_book_me', JSON.stringify(keep)); } catch (e) {}
    done(ref.id, { name, plate, email });
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Request this booking';
    err.textContent = (e && e.code === 'permission-denied') ? 'Online booking just closed for this workshop. Please call them instead.' : 'Something went wrong: ' + (e.message || e);
  }
}
function done(id, d) {
  const end = toHHMM(toMin(sel.time) + (+W.slotMins || 30));
  const ics = 'BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:' + (sel.service + ' · ' + (W.name || 'Garage')).replace(/[,;\n]/g, ' ') +
    '\nDTSTART:' + sel.date.replace(/-/g, '') + 'T' + sel.time.replace(':', '') + '00\nDTEND:' + sel.date.replace(/-/g, '') + 'T' + end.replace(':', '') + '00\nLOCATION:' + (W.address || W.city || '').replace(/[,;\n]/g, ' ') + '\nEND:VEVENT\nEND:VCALENDAR';
  $('app').innerHTML = `<div class="step ok"><div class="tick"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1 style="font-size:24px">Request sent!</h1>
    <p class="sub">${esc(W.name || 'The workshop')} will confirm your booking shortly. <b>You will receive a confirmation by phone, WhatsApp or email.</b></p>
    <div class="sum"><span>Service</span> <b>${esc(sel.service)}</b><br><span>When</span> <b>${esc(prettyDate(sel.date))}, ${fmt12(sel.time)}</b><br><span>Vehicle</span> <b>${esc(d.plate)}</b><br><span>Reference</span> <b>${esc(id.slice(0, 6).toUpperCase())}</b></div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px">
      <a class="chip" download="booking.ics" href="data:text/calendar;charset=utf-8,${encodeURIComponent(ics)}" style="text-decoration:none">📅 Add to calendar</a>
      ${W.phone ? `<a class="chip" href="tel:${esc(W.phone)}" style="text-decoration:none">📞 Call the workshop</a>` : ''}
    </div></div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
<script src="i18n/gp-lang.js"></script>
</body>
</html>
