<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your car · Garage Pro</title>
<meta name="robots" content="noindex, nofollow" />
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f7; --bg2:#eaeef0; --surf:#ffffff; --border:#dce3e6; --brd:#dce3e6; --brd2:#c4cdd2;
    --text:#1b2a31; --txt:#1b2a31; --dim:#46575f; --faint:#6d7d85;
    --acc:#2563b8; --acc2:#2563b8; --onacc:#ffffff; --teal:#157a5b; --red:#bf3a2e; --blue:#2563b8;
    --fd:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif; --fb:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif; --fm:'IBM Plex Mono',ui-monospace,monospace;
  }
  
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);-webkit-font-smoothing:antialiased}
  a{color:var(--acc2)}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font:700 15px var(--fd)}
  .logo{width:32px;height:32px;border-radius:9px;background:var(--acc);display:grid;place-items:center}
  .wrap{max-width:720px;margin:0 auto;padding:24px 16px 70px}
  h1{font:800 clamp(24px,5vw,30px)/1.15 var(--fd);margin:0 0 4px}
  .sub{color:var(--dim);font-size:14.5px;line-height:1.6;margin:0 0 4px}
  .ws{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--faint);font-size:13px;margin:6px 0 20px}
  .pill{display:inline-block;padding:4px 11px;border-radius:100px;background:var(--bg2);border:1px solid var(--border);color:var(--dim);font-size:12.5px;text-decoration:none}
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border)}
  .tab{background:none;border:0;color:var(--dim);font:600 14px var(--fb);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--text);border-color:var(--acc)}
  .card{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
  .plate{display:inline-block;background:#f6c332;color:#16130e;font:800 14px 'Courier New',monospace;padding:3px 10px;border-radius:5px;letter-spacing:1px}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .svc{font:700 17px var(--fd);margin:8px 0 2px}
  .stat{display:inline-block;padding:4px 11px;border-radius:100px;font:700 12.5px var(--fb);background:rgba(255,122,24,.14);color:var(--acc2)}
  .stat.done{background:rgba(32,227,178,.14);color:var(--teal)} .stat.bad{background:rgba(255,107,107,.14);color:var(--red)}
  .track{display:flex;align-items:flex-start;margin:20px 2px 6px;overflow-x:auto;padding-bottom:6px}
  .st{flex:1;min-width:40px;text-align:center;position:relative;font-size:9.5px;color:var(--faint);line-height:1.25}
  .st i{display:block;width:16px;height:16px;border-radius:50%;background:var(--bg2);border:2px solid var(--border);margin:0 auto 6px;position:relative;z-index:1}
  .st:not(:last-child)::after{content:'';position:absolute;top:7px;left:50%;width:100%;height:2px;background:var(--border)}
  .st.d i{background:var(--teal);border-color:var(--teal)} .st.d:not(:last-child)::after{background:var(--teal)}
  .st.c i{background:var(--acc);border-color:var(--acc)} .st.c{color:var(--text);font-weight:700}
  .cta{display:block;text-align:center;margin-top:14px;padding:13px;border-radius:12px;background:var(--acc);color:var(--onacc,#170f05);font:800 15px var(--fd);text-decoration:none}
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:14px}
  .photos a{position:relative;display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
  .photos img{width:100%;height:100%;object-fit:cover;display:block}
  .photos span{position:absolute;left:5px;top:5px;font:700 10px var(--fb);background:rgba(0,0,0,.65);color:#fff;padding:2px 7px;border-radius:100px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--faint);font:600 11.5px var(--fb);text-transform:uppercase;letter-spacing:.06em;padding:8px 6px;border-bottom:1px solid var(--border)}
  td{padding:11px 6px;border-bottom:1px solid var(--border);vertical-align:top}
  tr:last-child td{border-bottom:0}
  .muted{color:var(--faint);font-size:13.5px}
  .empty{text-align:center;padding:30px 10px;color:var(--faint)}
  footer{padding:22px;text-align:center;color:var(--faint);font-size:12.5px}
  .skeleton{height:120px;border-radius:14px;background:linear-gradient(90deg,var(--bg2),var(--surf),var(--bg2));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:50;padding:16px}
  .lb.on{display:grid} .lb img{max-width:100%;max-height:92vh;border-radius:10px}
</style>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="top"><a class="brand" href="/"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#170f05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.3 2.3-2-2 2.3-2.3z"/></svg></span><span class="bname">Garage Pro</span></a><span class="muted" id="upd"></span></div>
<div class="wrap" id="app"><div class="skeleton"></div></div>
<div class="lb" id="lb" onclick="this.classList.remove('on')"><img id="lbimg" alt=""></div>
<footer id="poweredby">Powered by <a href="/">Garage Pro</a></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({ apiKey: "AIzaSyA1PzbhboU9Qdlpqs5cbLR3hsvFpWXCI54", authDomain: "garagepro26.firebaseapp.com", projectId: "garagepro26",
  storageBucket: "garagepro26.firebasestorage.app", messagingSenderId: "605094681607", appId: "1:605094681607:web:095fbfb8ff0446faaedea2" });
const db = firebase.firestore();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let CURR = '₹', AEP = false, CTRY = 'IN';
const inr = n => CURR + (/^[A-Za-z]+$/.test(CURR) ? ' ' : '') + Number(n || 0).toLocaleString(AEP && CTRY !== 'PK' ? 'en-US' : 'en-IN', AEP ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : undefined);
const safeUrl = u => /^https:\/\//.test(u || '') ? u : '';
const q = new URLSearchParams(location.search);
const parts = location.pathname.split('/').filter(Boolean);
const W = q.get('w') || (parts[0] === 'portal' ? parts[1] : ''), T = q.get('t') || (parts[0] === 'portal' ? parts[2] : '');
let P = null, tab = 'cars', FQ = '', FF = 'all';

async function load(first) {
  if (!W || !T || !/^[A-Za-z0-9_-]{8,64}$/.test(T)) return location.replace('/403.html?why=link');
  try {
    const snap = await db.collection('users').doc(W).collection('customer_portal').doc(T).get();
    if (!snap.exists) return location.replace('/403.html?why=link');
    P = snap.data(); if (first && P.fleet) tab = 'fv'; CURR = (P.workshop && P.workshop.currency) || '₹'; AEP = !!(P.workshop && ['AE', 'QA', 'US', 'PK'].includes(P.workshop.country)); CTRY = (P.workshop && P.workshop.country) || 'IN'; render();
  } catch (e) {
    if (first) { if (e && e.code === 'permission-denied') return location.replace('/403.html?why=link'); $('app').innerHTML = `<div class="card empty">Couldn't load your page. ${esc(e.message || e)}<br><br><button class="pill" onclick="location.reload()">Try again</button></div>`; }
  }
}
function render() {
  applyBrand({ color: P.workshop.color, logo: P.workshop.logo }, P.workshop.name);
  document.title = `Your car · ${P.workshop.name || 'Garage Pro'}`;
  const w = P.workshop, jobs = P.jobs || [], active = jobs.filter(j => j.status !== 'Delivered' && j.status !== 'Cancelled');
  $('upd').textContent = P.updated_at ? 'Updated ' + new Date(P.updated_at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
  const approve = jobs.find(j => j.estimate_url);
  $('app').innerHTML = `
    ${P.fleet ? `<h1>${esc(P.fleet.company || P.customer.first)}</h1>
    <p class="sub">Fleet portal · ${(P.fleet.vehicles || []).length} vehicle${(P.fleet.vehicles || []).length === 1 ? '' : 's'}${active.length ? ` · ${active.length} with ${esc(w.name || 'your workshop')} now` : ''}</p>` : `<h1>Hi ${esc(P.customer.first)} 👋</h1>
    <p class="sub">${active.length ? `${active.length} car${active.length > 1 ? 's' : ''} currently with ${esc(w.name || 'your workshop')}.` : `Your car history with ${esc(w.name || 'your workshop')}.`}</p>`}
    <div class="ws"><b style="color:var(--text)">${esc(w.name)}</b>${w.city ? `<span>· ${esc(w.city)}</span>` : ''}${w.phone ? `<a class="pill" href="tel:${esc(w.phone)}">Call</a><a class="pill" href="https://wa.me/${esc(String(w.phone).replace(/\D/g, '').replace(/^(\d{10})$/, '91$1'))}" target="_blank" rel="noopener">WhatsApp</a>` : ''}</div>
    ${approve ? `<a class="cta" href="${esc(safeUrl(approve.estimate_url))}" style="margin:0 0 16px">${P.fleet ? `An estimate is ready for ${esc(approve.plate)}` : 'Your estimate is ready'} — review &amp; approve →</a>` : ''}
    ${P.fleet ? fleetSummary(P.fleet) : ''}
    <div class="tabs">${(P.fleet ? [['fv', 'Vehicles'], ['cars', 'In the workshop'], ['inv', 'Invoices'], ['stm', 'Statements']] : [['cars', 'My cars'], ['inv', 'Invoices'], ['hist', 'Service history']]).map(([k, l]) => `<button class="tab ${tab === k ? 'on' : ''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div>
    <div id="pane"></div>`;
  pane();
}

// Workshop branding: logo + name + colour scheme, with "Powered by Garage Pro" kept visible.
function applyBrand(b, name) {
  b = b || {};
  const root = document.documentElement.style;
  if (/^#[0-9a-fA-F]{6}$/.test(b.color || '')) {
    const n = parseInt(b.color.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, bl = n & 255, mix = x => Math.round(x + (255 - x) * 0.28);
    root.setProperty('--acc', b.color); root.setProperty('--acc2', `rgb(${mix(r)},${mix(g)},${mix(bl)})`);
    root.setProperty('--onacc', (0.299 * r + 0.587 * g + 0.114 * bl) / 255 > 0.62 ? '#16130e' : '#ffffff');
  }
  const brand = document.querySelector('.brand'); if (!brand) return;
  const logoEl = brand.querySelector('.logo'), nm = brand.querySelector('.bname');
  if (name && nm) nm.textContent = name;
  if (logoEl) {
    if (/^(data:image\/(png|jpeg|webp);base64,|https:\/\/)/.test(b.logo || '')) {
      logoEl.style.cssText = 'background:#fff;padding:3px 6px;width:auto;min-width:32px;height:34px';
      logoEl.innerHTML = '<img alt="" style="height:26px;max-width:120px;object-fit:contain;display:block">'; logoEl.firstChild.src = b.logo;
    } else if (name) {
      logoEl.innerHTML = '<span style="font:800 16px var(--fd);color:var(--onacc,#170f05)"></span>'; logoEl.firstChild.textContent = name.trim().charAt(0).toUpperCase();
    }
  }
  const pb = document.getElementById('poweredby');
  if (pb) pb.innerHTML = 'Powered by <a href="/" style="color:inherit;font-weight:700;text-decoration:none">Garage Pro</a>';
}

function setTab(t) { tab = t; render(); }
function fleetSummary(F) {
  const k = (l, v, sub, col) => `<div class="card" style="margin:0;padding:12px 14px"><div style="font:800 20px var(--fd);color:${col || 'var(--text)'}">${v}</div><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:2px">${l}</div>${sub ? `<div class="muted" style="font-size:12px;margin-top:2px">${sub}</div>` : ''}</div>`;
  const vs = F.vehicles || [], due = vs.filter(v => v.due_state === 'overdue' || v.due_state === 'soon').length;
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px">
    ${k('Outstanding', inr(F.outstanding), F.unpaid_count ? `${F.unpaid_count} unpaid invoice${F.unpaid_count === 1 ? '' : 's'}` : 'all paid', F.outstanding ? 'var(--acc2)' : 'var(--teal)')}
    ${F.overdue ? k('Overdue', inr(F.overdue), 'past payment terms', 'var(--red)') : ''}
    ${k('Service due', due, due ? 'overdue or within 30 days' : 'all up to date', due ? 'var(--acc2)' : 'var(--teal)')}
    ${F.credit_limit ? k('Credit used', (F.used_pct == null ? 0 : F.used_pct) + '%', inr(Math.max(0, F.credit_limit - F.outstanding)) + ' left', F.used_pct >= 100 ? 'var(--red)' : 'var(--text)') : ''}
  </div>`;
}
const dmy = s => { try { return new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (_) { return s || ''; } };
function fleetList() {
  const el = $('flist'); if (!el) return;
  const q = FQ.trim().toLowerCase().replace(/\s+/g, '');
  const vs = (P.fleet.vehicles || []).filter(v => (!q || (v.plate + v.model).toLowerCase().replace(/\s+/g, '').includes(q)) && (FF === 'all' || (FF === 'due' && (v.due_state === 'overdue' || v.due_state === 'soon')) || (FF === 'shop' && v.status)));
  el.innerHTML = vs.length ? vs.map(v => {
    const chip = v.status ? ['In workshop · ' + v.status, ''] : v.due_state === 'overdue' ? ['Service overdue', 'bad'] : v.due_state === 'soon' ? ['Service due soon', ''] : v.due_state === 'none' ? ['No service on record', ''] : ['Up to date', 'done'];
    return `<div class="card" style="padding:13px 15px;margin-bottom:10px"><div class="row"><div><span class="plate">${esc(v.plate)}</span> <span class="muted">${esc(v.model)}</span></div><span class="stat ${chip[1]}">${esc(chip[0])}</span></div>
      <div class="muted" style="margin-top:8px;line-height:1.7">${v.last_service ? `Last service <b style="color:var(--text)">${esc(dmy(v.last_service))}</b>${v.last_type ? ' · ' + esc(v.last_type) : ''}` : 'No completed service yet'}${v.next_due ? ` · Next due <b style="color:${v.due_state === 'overdue' ? 'var(--red)' : 'var(--text)'}">${esc(dmy(v.next_due))}</b>` : ''}${v.visits ? ` · ${v.visits} visit${v.visits === 1 ? '' : 's'}` : ''}${v.service ? `<br>Now: ${esc(v.service)}` : ''}</div>
      ${v.outstanding > 0 ? `<div style="margin-top:6px;font-weight:700;color:var(--acc2)">Outstanding ${inr(v.outstanding)}</div>` : ''}</div>`;
  }).join('') : `<div class="card empty">No vehicles match.</div>`;
}
function setFq(v) { FQ = v; fleetList(); }
function setFf(v) { FF = v; fleetList(); }
function stmtMonthLabel(ym) { try { return new Date(ym + '-01T00:00:00').toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }); } catch (_) { return ym; } }
function printStmt(i) {
  const F = P.fleet, s = (P.fleet.statements || [])[i]; if (!s) return;
  const w = window.open('', '_blank'); if (!w) return;
  w.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(s.number)}</title><body style="font-family:Arial,sans-serif;max-width:760px;margin:30px auto;color:#111">
    <h2 style="margin:0">${esc(P.workshop.name || '')}</h2><div style="color:#555;margin-bottom:18px">Statement ${esc(s.number)} · ${esc(stmtMonthLabel(s.ym))}<br>${esc(F.company)}</div>
    <table style="width:100%;border-collapse:collapse;font-size:14px"><thead><tr style="background:#eee"><th style="text-align:left;padding:7px">Invoice</th><th style="text-align:left;padding:7px">Date</th><th style="text-align:left;padding:7px">Vehicle</th><th style="text-align:right;padding:7px">Total</th><th style="text-align:right;padding:7px">Balance</th></tr></thead><tbody>
    ${(s.lines || []).map(l => `<tr><td style="padding:7px;border-top:1px solid #ddd">${esc(l.no)}</td><td style="padding:7px;border-top:1px solid #ddd">${esc(dmy(l.date))}</td><td style="padding:7px;border-top:1px solid #ddd">${esc(l.plate)}</td><td style="padding:7px;border-top:1px solid #ddd;text-align:right">${inr(l.total)}</td><td style="padding:7px;border-top:1px solid #ddd;text-align:right">${l.balance > 0 ? inr(l.balance) : 'Paid'}</td></tr>`).join('')}
    </tbody></table><p style="text-align:right;font-size:15px"><b>Billed this month ${inr(s.billed)}</b>${s.bf ? `<br>Brought forward ${inr(s.bf)}` : ''}<br><b style="font-size:17px">Balance due ${inr(s.due)}</b><br>Pay by ${esc(dmy(s.due_date))}</p>
    <script>setTimeout(()=>print(),300)<\/script></body>`);
  w.document.close();
}
function pane() {
  const el = $('pane');
  if (tab === 'fv' && P.fleet) {
    el.innerHTML = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><input id="fq" type="search" placeholder="Search a plate or model" value="${esc(FQ)}" oninput="setFq(this.value)" style="flex:1;min-width:160px;padding:10px 12px;border-radius:10px;border:1px solid var(--brd2);background:var(--surf);color:var(--text);font:inherit">
      <select onchange="setFf(this.value)" style="padding:10px 12px;border-radius:10px;border:1px solid var(--brd2);background:var(--surf);color:var(--text);font:inherit"><option value="all" ${FF === 'all' ? 'selected' : ''}>All vehicles</option><option value="due" ${FF === 'due' ? 'selected' : ''}>Service due / overdue</option><option value="shop" ${FF === 'shop' ? 'selected' : ''}>In the workshop</option></select></div>
      <div id="flist"></div><div class="muted" style="font-size:12px;margin-top:6px">“Next due” is the last completed service plus ${P.fleet.interval_days || 180} days — the interval your workshop set for this account.</div>`;
    fleetList(); return;
  }
  if (tab === 'stm' && P.fleet) {
    const st = P.fleet.statements || [];
    el.innerHTML = st.length ? st.map((s, i) => `<details class="card" ${i === 0 ? 'open' : ''}><summary style="cursor:pointer;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700"><span>${esc(stmtMonthLabel(s.ym))}${s.current ? ' <span class="muted">(this month so far)</span>' : ''}</span><span>${s.due > 0 ? 'Due ' + inr(s.due) : '<span style="color:var(--teal)">Settled</span>'}</span></summary>
      <div class="muted" style="margin:8px 0">${esc(s.number)} · ${s.count} invoice${s.count === 1 ? '' : 's'} · billed ${inr(s.billed)}${s.bf ? ' · brought forward ' + inr(s.bf) : ''}${s.due > 0 ? ' · pay by ' + esc(dmy(s.due_date)) : ''}</div>
      <table><thead><tr><th>Invoice</th><th>Date</th><th>Vehicle</th><th style="text-align:right">Total</th><th style="text-align:right">Balance</th></tr></thead><tbody>${(s.lines || []).map(l => `<tr><td>${esc(l.no)}</td><td>${esc(dmy(l.date))}</td><td>${esc(l.plate)}</td><td style="text-align:right">${inr(l.total)}</td><td style="text-align:right">${l.balance > 0 ? inr(l.balance) : '<span class="muted">Paid</span>'}</td></tr>`).join('')}</tbody></table>
      <button class="pill" type="button" style="margin-top:10px;cursor:pointer" onclick="printStmt(${i})">🖨 Print / save PDF</button></details>`).join('') : `<div class="card empty">No statements yet.</div>`;
    return;
  }
  if (tab === 'cars') {
    const jobs = P.fleet ? (P.jobs || []).filter(j => j.status !== 'Delivered' && j.status !== 'Cancelled') : (P.jobs || []);
    if (!jobs.length) { el.innerHTML = `<div class="card empty">${P.fleet ? 'None of your vehicles are in the workshop right now.' : `No jobs yet. When your car comes in, you'll see its progress here.`}</div>`; return; }
    el.innerHTML = jobs.map(j => {
      const stages = P.stages || [], cancelled = j.stage < 0, cur = Math.max(0, j.stage);
      return `<div class="card">
        <div class="row"><div><span class="plate">${esc(j.plate)}</span> <span class="muted">${esc(j.vehicle)}</span><div class="svc">${esc(j.service)}</div></div>
          <span class="stat ${cancelled ? 'bad' : j.status === 'Delivered' ? 'done' : ''}">${esc(j.status)}</span></div>
        ${cancelled ? '' : `<div class="track">${stages.map((s, i) => `<div class="st ${i < cur ? 'd' : i === cur ? 'c' : ''}"><i></i>${esc(s)}</div>`).join('')}</div>`}
        <div class="muted">Booked ${esc(j.created)}${j.mechanic ? ` · technician ${esc(j.mechanic)}` : ''} · last update ${esc(j.updated.replace('T', ' '))}</div>
        ${j.estimate_url ? `<a class="cta" href="${esc(safeUrl(j.estimate_url))}">Review &amp; approve estimate →</a>` : ''}
        ${j.invoice ? `<div class="row" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)"><div><b>Invoice ${esc(j.invoice.no || '')}</b><div class="muted" style="font-size:12px">${esc(j.invoice.date)} · ${esc(j.invoice.paid)}</div></div><div style="text-align:right"><b>${inr(j.invoice.total)}</b>${safeUrl(j.invoice.url) ? ` <a class="pill" href="${esc(safeUrl(j.invoice.url))}" target="_blank" rel="noopener">View invoice</a>` : ''}</div></div>` : ''}
        ${(j.photos || []).length ? `<div class="photos">${j.photos.map(p => `<a href="#" onclick="zoom('${esc(safeUrl(p.url))}');return false"><img loading="lazy" src="${esc(safeUrl(p.url))}" alt="${esc(p.label)}"><span>${esc(p.label)}</span></a>`).join('')}</div>` : ''}
      </div>`;
    }).join('');
  } else if (tab === 'inv') {
    const inv = P.invoices || [];
    el.innerHTML = inv.length ? `<div class="card"><table><thead><tr><th>Invoice</th><th>Date</th><th>Vehicle</th><th style="text-align:right">Total</th><th></th></tr></thead><tbody>${inv.map(i => `<tr>
      <td><b>${esc(i.no || '—')}</b><div class="muted" style="font-size:12px">${esc(i.paid)}</div></td><td>${esc(i.date)}</td><td>${esc(i.plate)}</td><td style="text-align:right;font-weight:700">${inr(i.total)}</td>
      <td style="text-align:right">${safeUrl(i.url) ? `<a class="pill" href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener">View</a>` : ''}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="card empty">No invoices yet.</div>`;
  } else {
    const h = P.history || [];
    el.innerHTML = h.length ? `<div class="card">${h.map(x => `<div style="display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--border)"><div style="min-width:86px;color:var(--faint);font-size:13px">${esc(x.date)}</div><div style="flex:1"><b>${esc(x.service)}</b><div class="muted">${esc(x.plate)}</div></div><div style="font-weight:700">${x.total ? inr(x.total) : ''}</div></div>`).join('')}</div>`
      : `<div class="card empty">Your past services will appear here.</div>`;
  }
}
function zoom(u) { if (!u) return; $('lbimg').src = u; $('lb').classList.add('on'); }
load(true);
setInterval(() => { if (!document.hidden) load(false); }, 60000);
</script>
<script src="i18n/gp-lang.js"></script>
<script src="gp-busy.js"></script>
</body>
</html>
